<!doctype html>
<meta charset="utf-8">
<title>classSearch 브라우저 비용 측정</title>
<!--
  국면 한정 탐색을 실제 브라우저(onnxruntime-web · wasm 1스레드)에서 재는 페이지다.
  배포와 같은 조건으로 맞춘다 — ui.js가 쓰는 로컬 ort 번들, numThreads=1.
  저장소 루트에서 정적 서버를 띄우고 /tools/bench/bench-search.html 로 연다.
  tools/bench/run-bench.mjs가 크롬을 띄워 이 페이지의 runBench()를 부른다.
-->
<body>
<pre id="out">준비 중…</pre>
<script src="/web/ort/ort.wasm.min.js"></script>
<script src="/src/mighty-engine.js"></script>
<script src="/src/mighty-master.js"></script>
<script src="/src/mighty-ai.js"></script>
<script>
const log = m => { document.getElementById('out').textContent += '\n' + m; };

window.runBench = async function ({ deals = 12, K = 16, gate = 0.6, budgetMs = 4000 } = {}) {
  const ort = window.ort;
  ort.env.wasm.wasmPaths = new URL('/web/ort/', location.href).href;
  ort.env.wasm.numThreads = 1;                    // 배포와 같다(COOP/COEP 없음)
  const E = window.MightyEngine, AI = window.MightyAI;

  const t0 = performance.now();
  const session = await ort.InferenceSession.create('/web/model/mighty_master_v16e.onnx');
  const loadMs = performance.now() - t0;

  // 순수 정책 한 수 비용(비교 기준)
  const plain = await AI.createAgent({ tier: 'master', session, ort });
  const count = {};
  const agents = [];
  for (let p = 0; p < E.NUM_PLAYERS; p++)
    agents.push(await AI.createAgent({ tier: 'master', session, ort,
      classSearch: { K, gate, budgetMs, topM: 5, count } }));

  const searchMs = [], plainMs = [];
  let moves = 0, done = 0, classStates = 0;
  for (let i = 0; i < deals; i++) {
    const g = new E.MightyGame({ seed: 4242 + i });
    g.start(i % E.NUM_PLAYERS);
    let guard = 0;
    while (g.phase !== 'done' && g.phase !== 'redeal' && guard++ < 900) {
      const seat = g.currentPlayer;
      const fires = !!AI.weakleadState(g, seat);
      if (fires) {
        classStates++;                                 // 같은 국면에서 정책만 재는 비용
        const p0 = performance.now();
        await plain.act(g, seat);
        plainMs.push(performance.now() - p0);
      }
      const before = count.fired || 0;
      const s0 = performance.now();
      const act = await agents[seat].act(g, seat);
      const dt = performance.now() - s0;
      if ((count.fired || 0) > before) searchMs.push(dt);
      moves++;
      g.act(act);
    }
    if (g.phase === 'done') done++;
    log(`  ${i + 1}/${deals}판 · 탐색 발화 ${count.fired || 0}`);
  }
  const stat = a => {
    if (!a.length) return { n: 0 };
    const s = a.slice().sort((x, y) => x - y);
    return { n: a.length, avg: a.reduce((x, y) => x + y, 0) / a.length,
             p50: s[Math.floor(s.length / 2)], max: s[s.length - 1] };
  };
  return { loadMs, deals: done, moves, K, gate, classStates,
           search: stat(searchMs), policyAtSameStates: stat(plainMs),
           firedPerDeal: (count.fired || 0) / Math.max(1, done),
           ua: navigator.userAgent };
};
document.getElementById('out').textContent = 'ready';
</script>
</body>
