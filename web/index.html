function structuredCloneSafe(o) { return JSON.parse(JSON.stringify(o)); }
function deepMerge(base, over) {
  for (const k of Object.keys(over || {})) {
    if (over[k] && typeof over[k] === 'object' && !Array.isArray(over[k]) &&
        base[k] && typeof base[k] === 'object') {
      deepMerge(base[k], over[k]);
    } else base[k] = over[k];
  }
  return base;
}

// ---------------------------------------------------------------
// 랜덤 에이전트 (엔진 검증용 — 3단계에서 휴리스틱으로 교체)
// ---------------------------------------------------------------
class RandomAgent {
  constructor(rng) { this.rng = rng || Math.random; }
  pick(arr) { return arr[Math.floor(this.rng() * arr.length)]; }

  actBidding(game) {
    const acts = game.legalActions();
    const bids = acts.filter(a => a.type === 'bid');
    if (bids.length === 0 || this.rng() < 0.8) return { type: 'pass' };
    // 최소 공약 위주로
    const minCount = Math.min(...bids.map(b => b.count));
    const cands = bids.filter(b => b.count === minCount);
    return this.pick(cands);
  }

  actExchange(game) {
    const hand = game.hands[game.declarer].slice();
    // 비점수카드 우선 랜덤 3장
    hand.sort((a, b) => (isPointCard(a) ? 1 : 0) - (isPointCard(b) ? 1 : 0) + (this.rng() - 0.5) * 0.5);
    return { type: 'exchange', discard: hand.slice(0, FLOOR_SIZE) };
  }

  actFriend(game) {
    const hand = game.hands[game.declarer];
    const m = game.mightyCard;
    if (!hand.some(c => sameCard(c, m))) return { type: 'friend', mode: 'card', card: m };
    if (!hand.some(isJoker)) return { type: 'friend', mode: 'card', card: JOKER };
    // 기루다 A (마이티 무늬 제외) 시도, 없으면 초구 프렌드
    const g = game.contract.giruda;
    if (g !== 'N') {
      const gA = { suit: g, rank: 14 };
      if (!hand.some(c => sameCard(c, gA)) && !sameCard(gA, m)) {
        return { type: 'friend', mode: 'card', card: gA };
      }
    }
    return { type: 'friend', mode: 'first' };
  }

  actPlay(game) {
    const acts = game.legalActions();
    return this.pick(acts);
  }

  act(game) {
    switch (game.phase) {
      case 'bidding': return this.actBidding(game);
      case 'floor': return this.actExchange(game);
      case 'friend': return this.actFriend(game);
      case 'dealMissWindow': return { type: this.rng() < 0.5 ? 'dealMiss' : 'proceed' };
      case 'play': return this.actPlay(game);
      default: throw new Error('no action for phase ' + game.phase);
    }
  }
}

/* ============================================================
 *  HeuristicAgent — 3단계: 룰 기반 휴리스틱 컴퓨터 플레이어
 * ============================================================
 *  성향 파라미터 (0~1):
 *    risk       공약 공격성 — 핸드 평가 마진을 줄이고 공약 경쟁/셀프 선언 의지 ↑
 *    friendCoop 여당 협력 — 프렌드로서 주공 지원(점수 몰아주기, 강카드 개입) 강도
 *    defCoop    야당 협력 — 야당으로서 점수 관리(회피/몰아주기)와 조커콜 협조 강도
 *  자신의 손패 + 공개 정보(테이블/기록/공약/공개된 프렌드)만 사용한다.
 * ============================================================ */

// 학습·평가 표준 성향 3종: gambler / balanced / careful (risk 차등).
// team·loner는 하위호환용으로 남겨둠 — 프렌드 공개 후 협력은 전 성향 공통 최대.
const PERSONAS = {
  gambler:  { label: '승부사',     risk: 0.85, friendCoop: 0.60, defCoop: 0.50 },
  careful:  { label: '신중파',     risk: 0.25, friendCoop: 0.70, defCoop: 0.80 },
  team:     { label: '팀플레이어', risk: 0.50, friendCoop: 0.90, defCoop: 0.90 },
  loner:    { label: '독불장군',   risk: 0.70, friendCoop: 0.35, defCoop: 0.30 },
  balanced: { label: '밸런스',     risk: 0.50, friendCoop: 0.60, defCoop: 0.60 },
};

/** 편차치를 둔 성향 무작위 생성 (4단계 학습/5단계 랭킹용 그룹 생성기) */
function randomPersonality(rng = Math.random, base = null) {
  const clamp01 = x => Math.max(0.05, Math.min(0.95, x));
  const b = base || { risk: 0.5, friendCoop: 0.6, defCoop: 0.6 };
  const dev = () => (rng() - 0.5) * 0.5;
  return {
    label: '랜덤',
    risk: clamp01(b.risk + dev()),
    friendCoop: clamp01(b.friendCoop + dev()),
    defCoop: clamp01(b.defCoop + dev()),
  };
}

const HEURISTIC_WEIGHTS = {
  // 비딩
  bidMargin: 1.3, bidRiskScale: 2.2, competeBase: 0.55, competeRisk: 0.45,
  selfThresh: 19.5, selfRisk: 2.0,
  // 리드
  trumpLead: 4, jokerLeadMid: 6, costLead: 0.25,
  // 팔로우/공통
  ptsValue: 2.2, trickBase: 1.2, overtakeAvoid: 2.5, defendPts: 0.6,
  costWin: 0.45, riskPenalty: 1.2, feed: 3.5, feedSafe: 0.55,
  dumpPtsPenalty: 4, costDump: 0.5, runProtect: 1.5, runBlock: 1.2,
  // v2: 카운팅 기반
  beatRisk: 0.3,      // 미출현 상위 카드 1장당 뒤집힐 위험 가중
  friendGuard: 2.5,   // 여당이 이기는 트릭에 프렌드가 기루다/고카드 낭비 억제
  mightyGate: 2.5,    // 저가치 트릭 마이티 소진 억제
  // 고급 티어: 프렌드 미공개 구간의 아군 확률 (실측 기반 — 공개 전 비주공 승자의
  // 83%가 실제 야당, 17%가 숨은 프렌드)
  hiddenAllyPrior: 0.8,    // 야당 시점: 비주공 승자가 동료 야당일 확률
  hiddenFriendPrior: 0.2,  // 주공 시점: 비주공 승자가 숨은 프렌드일 확률
  friendFeedEvidence: 0.8,   // 주공 승 트릭에 점수 공급 → 프렌드 가능성 가중
  friendStealEvidence: 0.7,  // 주공 승 트릭 탈취 → 프렌드 가능성 감쇄
  friendGuardKey: 3.0,       // 아군 확정승 트릭에 마이티·조커 낭비 억제(프렌드)
  advJitter: 0.1,            // 고급 티어 탐색 잡음 (중급 0.3) — 협력 결정 안정화
  friendFeedScale: 1,        // 실험용: 프렌드의 주공 점수공급 강도 (0이면 신호 차단)
};

/**
 * AI 티어.
 *  intermediate(중급) — 현행 로직. 팀이 확정된 뒤에만 협력.
 *  advanced(고급)     — 프렌드 미공개 구간에서도 아군 확률로 협력 강도를 가중.
 * 마스터 티어는 신경망(mighty_master.onnx + mighty-master.js)이 담당한다.
 */
const TIERS = ['intermediate', 'advanced'];

class HeuristicAgent {
  /** personality: {risk, friendCoop, defCoop, label?, weights?: HEURISTIC_WEIGHTS 부분 오버라이드} */
  constructor(personality = PERSONAS.balanced, rng = Math.random, opts = {}) {
    this.p = { ...personality };
    this.w = { ...HEURISTIC_WEIGHTS, ...(personality.weights || {}) };
    this.rng = rng;
    this.tier = opts.tier || 'intermediate';
    if (!TIERS.includes(this.tier)) throw new Error('unknown tier ' + this.tier);
  }

  /** history 트릭의 서열 계산용 pl 스텁 */
  _trickStub(t) {
    const p0 = t.plays[0];
    return {
      ledSuit: p0.jokerSuit || (isJoker(p0.card) ? null : p0.card.suit),
      trickNo: t.trickNo,
      jokerCallActive: t.plays.some(x => x.jokerCall),
    };
  }

  /**
   * 공개 정보로 추정한 프렌드 정체 확률 (좌석별, 합 1).
   * 증거: 주공이 이긴 트릭에 점수카드를 넣어준 좌석은 프렌드 가능성↑,
   *       주공이 이기고 있던 트릭을 뺏은 좌석은 가능성↓.
   */
  _friendBelief(game, me, iAmFriend) {
    const n = NUM_PLAYERS, decl = game.declarer;
    const b = new Array(n).fill(0);
    if (iAmFriend) { b[me] = 1; return b; }
    if (game.friendRevealed) {
      if (game.friend !== null && game.friend !== undefined) b[game.friend] = 1;
      return b;                                   // 셀프/노프렌드면 전원 0
    }
    for (let p = 0; p < n; p++) if (p !== decl && p !== me) b[p] = 1;
    const pl = game.play;
    if (pl) {
      for (const t of pl.history) {
        const stub = this._trickStub(t);
        for (const e of t.plays) {
          if (e.player === decl || b[e.player] === 0) continue;
          if (t.winner === decl && isPointCard(e.card))
            b[e.player] *= 1 + this.w.friendFeedEvidence;
        }
        if (t.winner !== decl && b[t.winner]) {
          // 이 좌석이 없었다면 주공이 이겼을 트릭인가 → 탈취 증거
          let bestE = null, bestK = [-2, -1];
          for (const e of t.plays) {
            if (e.player === t.winner) continue;
            const k = game._cardStrength(e, stub);
            if (k[0] > bestK[0] || (k[0] === bestK[0] && k[1] > bestK[1])) { bestK = k; bestE = e; }
          }
          if (bestE && bestE.player === decl)
            b[t.winner] *= 1 - this.w.friendStealEvidence;
        }
      }
    }
    const sum = b.reduce((x, y) => x + y, 0);
    if (sum > 0) for (let p = 0; p < n; p++) b[p] /= sum;
    return b;
  }

  /**
   * 현재 트릭 승자가 내 아군일 신뢰도 (0~1).
   * 중급은 확정 정보만 쓰므로 0 또는 1. 고급은 프렌드 미공개 구간에서 사전확률을 쓴다.
   * 프렌드 본인은 '주공이 아닌 승자 = 야당'이 확정이므로 사전확률을 쓰지 않는다.
   */
  _allyConfidence(game, ctx) {
    const side = ctx.tableWinnerSide;
    if (side === 'none') return 0;
    // 초구 프렌드: 이 트릭의 승자가 곧 프렌드로 확정된다 → 사전확률이 아니라 역전
    const firstMode = game.friendDecl && game.friendDecl.mode === 'first' &&
                      !game.friendRevealed;
    if (ctx.side === 'ruling') {
      if (side === 'ruling') return 1;
      if (side !== 'unknown' || this.tier !== 'advanced' || ctx.iAmFriend) return 0;
      if (firstMode) return 1;                           // 초구모드면 승자가 내 프렌드가 됨
      return ctx.friendBelief ? ctx.friendBelief[ctx.tableWinner] : this.w.hiddenFriendPrior;
    }
    if (side === 'opp') return 1;
    if (side !== 'unknown' || this.tier !== 'advanced') return 0;
    if (firstMode) return 0;                             // 초구모드면 승자는 여당이 됨
    return ctx.friendBelief ? 1 - ctx.friendBelief[ctx.tableWinner] : this.w.hiddenAllyPrior;
  }

  /**
   * 플레이 시 적용할 성향.
   * 프렌드 공개(= 팀 확정) 이후에는 성향과 무관하게 최대 협력(여당/야당 모두).
   * 팀이 아직 불확실한 구간에서만 성향(friendCoop/defCoop)대로 행동한다.
   * 비딩 성향(risk)은 항상 성향대로.
   */
  _persona(game) {
    if (!game.friendRevealed) return this.p;
    if (!this._pCoop) this._pCoop = { ...this.p, friendCoop: 1, defCoop: 1 };
    return this._pCoop;
  }

  act(game) {
    switch (game.phase) {
      case 'bidding': return this.actBidding(game);
      case 'floor':   return this.actExchange(game);
      case 'friend':  return this.actFriend(game);
      case 'dealMissWindow': {
        const me = game.currentPlayer;
        const g = game.contract.giruda;
        const gCnt = g === 'N' ? 0 : game.hands[me].filter(c => !isJoker(c) && c.suit === g).length;
        return { type: gCnt >= 4 ? 'proceed' : 'dealMiss' };
      }
      case 'play':    return this.actPlay(game);
      default: throw new Error('no action for phase ' + game.phase);
    }
  }

  /* ---------------- 핸드 평가 ---------------- */
  /** 기루다 후보 g에 대한 기대 여당 점수 (프렌드 기대 포함) */
  evalHand(hand, g, game) {
    const mighty = g === 'S' ? { suit: 'D', rank: 14 } : { suit: 'S', rank: 14 };
    const hasM = hand.some(c => sameCard(c, mighty));
    const hasJ = hand.some(isJoker);
    let tricks = (hasM ? 1 : 0) + (hasJ ? 0.9 : 0);
    const bySuit = {};
    for (const s of SUITS) bySuit[s] = hand.filter(c => !isJoker(c) && c.suit === s);

    if (g !== 'N') {
      const gs = bySuit[g];
      const len = gs.length;
      tricks += Math.max(0, len - 3) * 0.9;                    // 긴 기루다
      for (const c of gs) {
        if (c.rank === 14 && !sameCard(c, mighty)) tricks += 0.95;
        else if (c.rank === 13) tricks += len >= 2 ? 0.75 : 0.4;
        else if (c.rank === 12) tricks += len >= 3 ? 0.5 : 0.2;
        else if (c.rank === 11) tricks += len >= 4 ? 0.3 : 0.1;
      }
    }
    // 사이드 수트 하이카드
    for (const s of SUITS) {
      if (s === g) continue;
      const cs = bySuit[s];
      for (const c of cs) {
        if (c.rank === 14 && !sameCard(c, mighty)) tricks += 0.8;
        else if (c.rank === 13) tricks += cs.length >= 2 ? 0.4 : 0.15;
      }
      if (g !== 'N' && cs.length === 0 && bySuit[g].length >= 3) tricks += 0.5; // 보이드+기루다
      if (g !== 'N' && cs.length === 1 && bySuit[g].length >= 4) tricks += 0.25;
    }
    if (g === 'N') {
      // 노기루다: 하이카드 집중도 요구
      let highs = 0;
      for (const c of hand) if (!isJoker(c) && c.rank >= 13) highs++;
      tricks += highs * 0.25;
      if (!hasM || !hasJ) tricks -= 1.5; // 마이티·조커 없으면 크게 감점
    }
    // 프렌드 기대치: 없는 최강 카드를 부른다
    let friendBoost = 0;
    if (!hasM) friendBoost = 3.2;
    else if (!hasJ) friendBoost = 2.8;
    else friendBoost = 2.1; // 기루다 A 등
    // 트릭 → 점수 환산: 여당 트릭당 평균 약 2.2점 + 바닥/주도권 기대
    return { est: tricks * 2.2 + friendBoost + 2.6, tricks, hasM, hasJ };
  }

  bestGiruda(hand, game) {
    let best = null;
    for (const g of SUITS) {
      const e = this.evalHand(hand, g, game);
      if (!best || e.est > best.est) best = { g, ...e };
    }
    const nt = this.evalHand(hand, 'N', game);
    if (nt.est > best.est + 1.0) best = { g: 'N', ...nt }; // NT는 보수적으로
    return best;
  }

  /* ---------------- 비딩 ---------------- */
  actBidding(game) {
    const me = game.currentPlayer;
    const hand = game.hands[me];
    const ev = this.bestGiruda(hand, game);
    // 마진: 신중할수록 큼 (risk 0 → +0.9, risk 1 → -1.3)
    const margin = this.w.bidMargin - this.w.bidRiskScale * this.p.risk;
    const afford = Math.floor(ev.est - margin);
    const legal = game.legalActions().filter(a => a.type === 'bid' && a.giruda === ev.g);
    if (legal.length === 0) return { type: 'pass' };
    const minLegal = Math.min(...legal.map(a => a.count));
    if (minLegal > afford) return { type: 'pass' };
    // 경쟁 상황에서 재공약 의지: risk 낮으면 이미 공약이 있으면 한 번 더 망설임
    if (game.bidding.best && this.rng() > this.w.competeBase + this.p.risk * this.w.competeRisk) return { type: 'pass' };
    return { type: 'bid', count: minLegal, giruda: ev.g };
  }

  /* ---------------- 바닥패 교환 (+공약 수정) ---------------- */
  actExchange(game) {
    const me = game.declarer;
    const hand = game.hands[me];
    const cfg = game.config;
    // 바닥패 반영 후 최적 기루다 재평가
    const re = this.bestGiruda(hand, game);
    let revise = null;
    const cur = game.contract;
    if (cfg.allowBidRevise && re.g !== cur.giruda) {
      const cost = re.g === 'N' ? cfg.toNoGirudaChangeCost : cfg.girudaChangeCost;
      const newCount = cur.count + cost;
      // 새 기루다 기대가 비용을 크게 상회할 때만 변경
      if (newCount <= cfg.maxBid && re.est - 2.0 >= newCount &&
          re.est > this.evalHand(hand, cur.giruda, game).est + 2.0) {
        revise = { count: newCount, giruda: re.g };
      }
    }
    const g = revise ? revise.giruda : cur.giruda;
    const mighty = g === 'S' ? { suit: 'D', rank: 14 } : { suit: 'S', rank: 14 };
    const bySuitLen = {};
    for (const s of SUITS) bySuitLen[s] = hand.filter(c => !isJoker(c) && c.suit === s).length;
    const pointPenalty = cfg.discardPointsTo === 'defenders' ? 6 : cfg.discardPointsTo === 'declarer' ? 0.5 : 3;
    const value = c => {
      if (isJoker(c) || sameCard(c, mighty)) return 999;
      let v = c.rank * 0.15;
      if (g !== 'N' && c.suit === g) v += 5;
      if (isPointCard(c)) v += pointPenalty;
      if (bySuitLen[c.suit] <= 2 && (g === 'N' || c.suit !== g)) v -= 1.2; // 보이드 생성 유도
      return v;
    };
    const discard = hand.slice().sort((a, b) => value(a) - value(b)).slice(0, FLOOR_SIZE);
    const act = { type: 'exchange', discard };
    if (revise) act.revise = revise;
    return act;
  }

  /* ---------------- 프렌드 지정 ---------------- */
  actFriend(game) {
    const me = game.declarer;
    const hand = game.hands[me];
    const has = c => hand.some(h => sameCard(h, c));
    const m = game.mightyCard;
    const g = game.contract.giruda;
    const ev = this.evalHand(hand, g, game);
    // 손이 압도적이면 셀프(노프렌드): risk가 높을수록 과감
    if (ev.est >= this.w.selfThresh - this.p.risk * this.w.selfRisk && ev.hasM && ev.hasJ) {
      return { type: 'friend', mode: 'none' };
    }
    if (!has(m)) return { type: 'friend', mode: 'card', card: m };
    if (!has(JOKER)) return { type: 'friend', mode: 'card', card: JOKER };
    if (g !== 'N') {
      const gA = { suit: g, rank: 14 };
      if (!sameCard(gA, m) && !has(gA)) return { type: 'friend', mode: 'card', card: gA };
      const gK = { suit: g, rank: 13 };
      if (!has(gK)) return { type: 'friend', mode: 'card', card: gK };
    }
    return { type: 'friend', mode: 'first' };
  }

  /* ---------------- 플레이 공통 정보 ---------------- */
  _ctx(game) {
    const me = game.play.turn;
    const pl = game.play;
    const played = [];
    for (const t of pl.history) for (const e of t.plays) played.push(e.card);
    for (const e of pl.table) played.push(e.card);
    const gone = c => played.some(x => sameCard(x, c));
    const mighty = game.mightyCard;
    // --- 카드 카운팅: 내 시점에서 미출현(=상대 손 + 바닥패) 카드 집계 ---
    const seen = new Set(played.map(c => cardId(c)));
    for (const c of game.hands[me]) seen.add(cardId(c));
    if (me === game.declarer && game.discard) for (const c of game.discard) seen.add(cardId(c));
    const outRanks = {};
    for (const s of SUITS) {
      outRanks[s] = [];
      for (let r = 14; r >= 2; r--) if (!seen.has(s + r)) outRanks[s].push(r);
    }
    const mightyOut = !seen.has(cardId(mighty));
    const jokerOut = !seen.has(JOKER);
    const iAmDeclarer = me === game.declarer;
    const iAmFriend = !iAmDeclarer && (
      (game.friendRevealed && game.friend === me) ||
      (game.friendDecl && game.friendDecl.mode === 'card' &&
       game.hands[me].some(c => sameCard(c, game.friendDecl.card))));
    const side = iAmDeclarer || iAmFriend ? 'ruling' : 'opp';
    // 현재 트릭 승자 예측
    let bestE = null, bestK = [-2, -1];
    for (const e of pl.table) {
      const k = game._cardStrength(e, pl);
      if (k[0] > bestK[0] || (k[0] === bestK[0] && k[1] > bestK[1])) { bestK = k; bestE = e; }
    }
    const winnerSide = w => {
      if (w === null) return 'none';
      if (w === game.declarer) return 'ruling';
      if (game.friendRevealed && game.friend === w) return 'ruling';
      if (game.friendRevealed && game.friend !== null) return 'opp';
      // 프렌드 미공개: 주공 외에는 불확실 → 야당으로 가정하되 표시
      return w === game.declarer ? 'ruling' : 'unknown';
    };
    // 런 추격/저지: 각자의 획득 더미는 공개 정보. 팀 합산은 프렌드 공개 후 확정.
    let rulingPts = null, oppPts = null;
    if (game.friendRevealed) {
      rulingPts = pl.capturedPoints[game.declarer] +
                  (game.friend !== null ? pl.capturedPoints[game.friend] : 0);
      oppPts = pl.capturedPoints.reduce((a, b) => a + b, 0) - rulingPts;
    }
    return {
      me, pl, gone, mighty, iAmDeclarer, iAmFriend, side, rulingPts, oppPts,
      friendBelief: this.tier === 'advanced'
        ? this._friendBelief(game, me, iAmFriend) : null,
      tableWinner: bestE ? bestE.player : null,
      tableWinnerKey: bestK,
      tableWinnerSide: bestE ? winnerSide(bestE.player) : 'none',
      pointsOnTable: pl.table.filter(e => isPointCard(e.card)).length,
      mightyGone: gone(mighty),
      jokerGone: gone(JOKER),
      isLast: pl.table.length === NUM_PLAYERS - 1,
      g: game.contract.giruda,
      outRanks, mightyOut, jokerOut,
      playersAfter: NUM_PLAYERS - 1 - pl.table.length,
    };
  }

  /** 특정 서열 키를 이길 수 있는 미출현 카드 수 (정확한 카운팅) */
  _beaters(game, ctx, key) {
    let n = 0;
    if (key[0] < 4 && ctx.mightyOut) n++;
    // 조커: 이번 트릭에 유효할 때만 위협
    const cfg = game.config;
    const jokerLive = ctx.jokerOut && !ctx.pl.jokerCallActive &&
      !(cfg.firstTrickJokerWeak && ctx.pl.trickNo === 1) &&
      !(cfg.lastTrickJokerWeak && ctx.pl.trickNo === HAND_SIZE);
    if (key[0] < 3 && jokerLive) n++;
    if (ctx.g !== 'N') {
      const outG = ctx.outRanks[ctx.g];
      if (key[0] === 2) n += outG.filter(r => r > key[1]).length;  // 더 높은 기루다
      else if (key[0] <= 1) n += outG.length;                       // 모든 기루다가 위협
    }
    if (key[0] === 1) n += ctx.outRanks[ctx.pl.ledSuit] ? ctx.outRanks[ctx.pl.ledSuit].filter(r => r > key[1]).length : 0;
    return n;
  }

  /** 이 무브를 냈을 때 이기는가 + 뒤집힐 위험도 (0 = 확정 승) */
  _winEval(game, ctx, mv) {
    const pl = ctx.pl;
    const entry = { player: ctx.me, card: mv.card };
    if (mv.jokerSuit) entry.jokerSuit = mv.jokerSuit;
    const key = game._cardStrength(entry, pl);
    const winsNow = key[0] > ctx.tableWinnerKey[0] ||
      (key[0] === ctx.tableWinnerKey[0] && key[1] > ctx.tableWinnerKey[1]);
    if (!winsNow) return { winsNow: false, risk: 1, key };
    if (ctx.isLast || key[0] === 4) return { winsNow: true, risk: 0, key };
    const b = this._beaters(game, ctx, key);
    if (b === 0) return { winsNow: true, risk: 0, key };            // 현존 탑카드: 확정
    const risk = Math.min(1, b * this.w.beatRisk * (ctx.playersAfter / 4 + 0.35));
    return { winsNow: true, risk, key };
  }

  /* ---------------- 플레이 ---------------- */
  actPlay(game) {
    const legal = game.legalActions();
    // 조커콜 강제 구간: 마이티로 조커를 보호할지 판단
    if (legal.length === 2 && legal.some(m => m.forced) && legal.some(m => m.protect)) {
      const ctx = this._ctx(game);
      const pts = ctx.pointsOnTable;
      // 트릭에 점수가 걸렸거나 후반이면 마이티로 받아 조커를 지킨다
      const late = ctx.pl.trickNo >= 6;
      return (pts >= 1 || late) ? legal.find(m => m.protect) : legal.find(m => m.forced);
    }
    if (legal.length === 1) return legal[0];
    const ctx = this._ctx(game);
    const leading = ctx.pl.table.length === 0;
    let best = null, bestScore = -1e9;
    for (const mv of legal) {
      const s = leading ? this._scoreLead(game, ctx, mv) : this._scoreFollow(game, ctx, mv);
      const jitter = this.rng() * (this.tier === 'advanced' ? this.w.advJitter : 0.3);
      if (s + jitter > bestScore) { bestScore = s + jitter; best = mv; }
    }
    return best;
  }

  _cardCost(mv, ctx) {
    // 카드 소모 비용: 강한 카드일수록 아깝다
    const c = mv.card;
    if (isJoker(c)) return 7;
    if (sameCard(c, ctx.mighty)) return 9;
    let v = c.rank * 0.28;
    if (ctx.g !== 'N' && c.suit === ctx.g) v += 1.6;
    return v;
  }

  _scoreLead(game, ctx, mv) {
    const c = mv.card;
    const p = this._persona(game);
    const myPointsOut = isPointCard(c) ? 1 : 0;
    let s = 0;
    const we = this._winEval(game, ctx, mv); // 테이블 비었으니 winsNow=true
    const winProb = 1 - we.risk;

    if (ctx.side === 'ruling') {
      // 여당 리드: 기루다 소진 유도, 확실한 트릭 캐시
      if (isJoker(c)) {
        // 조커 리드: 기루다 요구로 야당 기루다 제거 (중반 이후)
        const t = ctx.pl.trickNo;
        s = (t >= 3 && t <= 8 ? this.w.jokerLeadMid : 3) + (ctx.g !== 'N' && mv.jokerSuit === ctx.g ? 2 : 0);
        if (game.config.lastTrickJokerWeak && t >= 9) s += 4; // 막트릭 전에 소진
        if (game.config.firstTrickJokerWeak && t === 1) s = -8;
      } else if (ctx.g !== 'N' && c.suit === ctx.g) {
        const outG = ctx.outRanks[ctx.g].length;
        if (outG === 0) s = 1 + winProb * 2;                        // 밖 기루다 소진 → 드로우 무의미
        else s = this.w.trumpLead + winProb * this.w.trumpLead - (14 - c.rank) * 0.1;
        if (ctx.iAmFriend) {
          // 프렌드는 자신이 현존 탑 기루다일 때만 기루다 리드 (주공 기루다 소진 방지)
          const iAmTop = ctx.outRanks[ctx.g].every(r => r < c.rank);
          if (!iAmTop) s -= this.w.friendGuard * p.friendCoop;
          else s -= (1 - p.friendCoop) * 2;
        }
      } else if (sameCard(c, ctx.mighty)) {
        s = ctx.pl.trickNo <= 2 && game.friendDecl && game.friendDecl.mode === 'card'
            && isJoker(game.friendDecl.card) ? 8 : 2 + winProb * 3; // 조커프렌드면 초반 마이티 리드
      } else {
        s = winProb * 5 - (c.rank <= 9 ? 0.5 : 0) + (c.rank === 14 ? 1.5 : 0);
      }
      if (myPointsOut) s -= (1 - winProb) * 4;
    } else {
      // 야당 리드
      if (mv.jokerCall) {
        // 조커콜: 조커가 살아있고 '내가 들고 있지 않을' 때만 의미 있음
        const iHoldJoker = game.hands[ctx.me].some(isJoker);
        s = (!ctx.jokerGone && !iHoldJoker) ? 4 + p.defCoop * 4 : -6;
      } else if (isJoker(c)) {
        s = -3; // 야당 조커 리드는 아껴둔다
      } else if (ctx.g !== 'N' && c.suit === ctx.g) {
        s = -2.5; // 기루다 리드 회피
      } else {
        s = (c.rank === 14 ? 3.5 : 0) + (c.rank <= 8 ? 2 : 0) + winProb * 1.5;
        if (myPointsOut) s -= 3 + p.defCoop * 2;               // 점수카드 리드 회피
      }
    }
    return s - this._cardCost(mv, ctx) * this.w.costLead;
  }

  _scoreFollow(game, ctx, mv) {
    const p = this._persona(game);
    const c = mv.card;
    const we = this._winEval(game, ctx, mv);
    const winProb = we.winsNow ? 1 - we.risk : 0;
    const pts = ctx.pointsOnTable + (isPointCard(c) ? 1 : 0);
    const cost = this._cardCost(mv, ctx);
    let s = 0;

    // 아군 신뢰도(0~1). 중급은 0/1, 고급은 미공개 구간에서 사전확률.
    const ally = this._allyConfidence(game, ctx);
    const friendlyWinning = ally > 0;

    // 현재 승자가 남은 플레이어에게 뒤집힐 수 있는지 (확정 아군/적군 승 판정)
    const winnerBeaters = ctx.tableWinner !== null ? this._beaters(game, ctx, ctx.tableWinnerKey) : 99;
    const winnerCertain = ctx.tableWinner !== null && winnerBeaters === 0;

    if (we.winsNow) {
      // 내가 이기는 수: 트릭 가치 = 점수 + 트릭 자체
      let trickValue = pts * this.w.ptsValue + this.w.trickBase;
      if (ctx.side === 'ruling') {
        if (friendlyWinning) {
          trickValue -= this.w.overtakeAvoid * ally;               // 이미 아군이 이김 → 오버테이크 자제
          if (winnerCertain) trickValue -= this.w.overtakeAvoid * ally;
          // 프렌드 가드: 아군 승 트릭에 기루다/고카드 낭비 억제
          if (ctx.iAmFriend && !isJoker(c) && !sameCard(c, ctx.mighty) &&
              ((ctx.g !== 'N' && c.suit === ctx.g) || c.rank >= 13))
            trickValue -= this.w.friendGuard * p.friendCoop * ally;
          // 마이티·조커를 아군 승 트릭에 버리지 않는다.
          //  · 아군의 승리가 '확정'이면 기본 카드 감각의 영역 → 전 티어 공통 적용
          //  · 불확실 구간(숨은 프렌드 등)의 확률적 억제는 고급 티어 전용
          if (isJoker(c) || sameCard(c, ctx.mighty)) {
            const keyCoop = ctx.iAmFriend ? p.friendCoop : 1;
            if (winnerCertain) trickValue -= this.w.friendGuardKey * keyCoop;
            else if (this.tier === 'advanced' && ctx.iAmFriend)
              trickValue -= this.w.friendGuardKey * keyCoop * ally;
          }
        }
        if (ctx.iAmFriend) trickValue += (p.friendCoop - 0.5) * 1.5;
      } else {
        trickValue += p.defCoop * pts * this.w.defendPts;        // 야당: 점수트릭 사수
        if (friendlyWinning) trickValue -= (this.w.overtakeAvoid + p.defCoop * 1.5) * ally;
      }
      // 런 상금(캡 고정)이 걸린 국면: 여당은 전 트릭 사수, 야당은 1점이라도 저지
      if (ctx.oppPts === 0 && ctx.rulingPts !== null) {
        if (ctx.side === 'ruling') trickValue += this.w.runProtect;
        else if (pts > 0) trickValue += this.w.runBlock + p.defCoop;
      }
      s = trickValue * winProb - cost * this.w.costWin;
      if (!ctx.isLast && we.risk > 0.5) s -= this.w.riskPenalty; // 어중간한 승부수 자제
    } else {
      // 이기지 못하는 수: 무엇을 버릴까
      if (isPointCard(c)) {
        // 아군이면 몰아주기, 적이면 헌납 금지 — 미공개 구간은 신뢰도로 두 항을 혼합
        const coop = ctx.side === 'ruling' ? p.friendCoop : p.defCoop;
        const safe = (ctx.isLast || winnerCertain) ? 1 : this.w.feedSafe;
        let feedS = this.w.feed * coop * safe + (c.rank === 10 ? 0.4 : 0);
        if (ctx.iAmFriend) feedS *= this.w.friendFeedScale;   // 신호 차단 실험용
        const dumpS = -this.w.dumpPtsPenalty - (ctx.side === 'opp' ? p.defCoop * 2 : 2);
        s = ally * feedS + (1 - ally) * dumpS;
      } else {
        s = 1.5 - cost * this.w.costDump;                        // 낮은 카드 정리
      }
    }

        if (gir2 && gir2 !== 'N' && !isJoker(c) && c.suit === gir2) o[eb + 14] = 1;
      }
      if (winner !== null && winner !== undefined) o[base + 75 + rel(winner)] = 1;
      o[base + 80] = (ti + 1) / 10;
    }
  }

  const rv = encodeRules(game.config);
  for (let i = 0; i < rv.length; i++) o[O.rule_ctx14 + i] = rv[i];
  return o;
}

function legalMask(game, pickBuffer) {
  const g = game, m = new Uint8Array(ACTION_DIM);
  const ph = g.phase;
  if (ph === 'bidding') {
    m[A_PASS] = 1;    // 실룰: 패스 항상 허용 (학습용 강제입찰 없음)
    for (const a of g.legalActions()) {
      if (a.type === 'bid' && a.count >= 13 && a.count <= 20)
        m[A_BID0 + GIRUDA5.indexOf(a.giruda) * 8 + (a.count - 13)] = 1;
      else if (a.type === 'dealMiss') m[A_DEALMISS] = 1;
    }
  } else if (ph === 'dealMissWindow') {
    m[A_DEALMISS] = 1; m[A_PROCEED] = 1;
  } else if (ph === 'floor') {
    const picked = (pickBuffer || []).slice();
    for (const c of g.hands[g.declarer]) {
      const i = picked.findIndex(x => sameCard(c, x));
      if (i >= 0) { picked.splice(i, 1); continue; }
      m[A_DISC0 + cidx(c)] = 1;
    }
  } else if (ph === 'friend') {
    for (let i = 0; i < 53; i++) m[A_FRIEND0 + i] = 1;
    m[A_FRIEND_FIRST] = 1; m[A_FRIEND_NONE] = 1;
  } else if (ph === 'play') {
    for (const mv of g.legalActions()) {
      if (isJoker(mv.card)) {
        if (mv.jokerSuit) m[A_PLAY_JOKER_SUIT0 + SUIT_IDX[mv.jokerSuit]] = 1;
        else m[A_PLAY_JOKER] = 1;
      } else if (mv.jokerCall) m[A_PLAY_JOKERCALL] = 1;
      else m[A_PLAY0 + cidx(mv.card)] = 1;
    }
  }
  return m;
}

/**
 * 프렌드 콜 후처리 모드. 학습된 정책은 판당 한 번뿐인 프렌드 선언에 학습 신호가 희박해
 * 주공이 마이티를 못 쥔 상황에서 마이티를 안 부르는 콜을 낸다 — 그러면 마이티가 81% 확률로
 * 야당에 떨어진다. 배포 측 후처리로 이 경우만 마이티 콜로 되돌린다.
 *   'off'   후처리 없음 (학습 정책 그대로)
 *   'joker' 조커 콜일 때만 교정
 *   'all'   마이티 아닌 카드 콜 전부 교정 (기본)
 */
let _friendCallFix = (typeof process !== 'undefined' && process.env && process.env.FRIEND_FIX) || 'all';
function setFriendCallFix(mode) { _friendCallFix = mode; }

/** 프렌드 카드 콜 교정. 주공이 마이티 보유 시엔 손대지 않는다(마이티 콜=셀프라 불가). */
function fixFriendCall(card, game) {
  if (_friendCallFix === 'off') return card;
  const mc = game.mightyCard;
  if (sameCard(card, mc)) return card;
  if (_friendCallFix === 'joker' && !isJoker(card)) return card;
  const decl = game.declarer;
  if (decl == null || game.hands[decl].some(c => sameCard(c, mc))) return card;
  return mc;
}

/** 행동 int → 엔진 act 객체. floor에선 3장 모일 때까지 null 반환(pickBuffer 누적). */
function actionToEngine(a, game, pickBuffer) {
  if (a === A_PASS) return { type: 'pass' };
  if (a === A_DEALMISS) return { type: 'dealMiss' };
  if (a === A_PROCEED) return { type: 'proceed' };
  if (a >= A_BID0 && a < A_DISC0) {
    const x = a - A_BID0;
    return { type: 'bid', count: x % 8 + 13, giruda: GIRUDA5[Math.floor(x / 8)] };
  }
  if (a >= A_DISC0 && a < A_FRIEND0) {
    pickBuffer.push(idxCard(a - A_DISC0));
    if (pickBuffer.length < 3) return null;
    const discard = pickBuffer.slice(); pickBuffer.length = 0;
    return { type: 'exchange', discard };
  }
  if (a === A_FRIEND_FIRST) return { type: 'friend', mode: 'first' };
  if (a === A_FRIEND_NONE) return { type: 'friend', mode: 'none' };
  if (a >= A_FRIEND0 && a < A_FRIEND_FIRST)
    return { type: 'friend', mode: 'card', card: fixFriendCall(idxCard(a - A_FRIEND0), game) };
  if (a === A_PLAY_JOKER) return { type: 'play', card: JOKER };
  if (a >= A_PLAY_JOKER_SUIT0 && a < A_PLAY_JOKER_SUIT0 + 4)
    return { type: 'play', card: JOKER, jokerSuit: SUITS[a - A_PLAY_JOKER_SUIT0] };
  if (a === A_PLAY_JOKERCALL)
    return { type: 'play', card: game.jokerCallCard, jokerCall: true };
  if (a >= A_PLAY0 && a < A_PLAY_JOKER_SUIT0)
    return { type: 'play', card: idxCard(a - A_PLAY0) };
  throw new Error('bad action ' + a);
}

/** onnxruntime-web 세션으로 greedy 행동 선택 */
/** 모델이 기대하는 관측 길이 (구버전 606 모델 호환 — v3 특징은 뒤에 붙였다) */
function modelObsDim(sess) {
  const meta = sess.inputMetadata;
  if (Array.isArray(meta)) {
    const m = meta.find(x => x.name === 'obs');
    const d = m && m.shape && m.shape[1];
    if (typeof d === 'number') return d;
  }
  return OBS_DIM;
}

async function chooseAction(sess, ort, game, seat, pickBuffer) {
  let obs = encodeObs(game, seat, pickBuffer);
  const mask = legalMask(game, pickBuffer);
  const want = modelObsDim(sess);
  if (want !== OBS_DIM) obs = obs.subarray(0, want);   // 구버전 모델은 앞부분만 사용
  const out = await sess.run({
    obs: new ort.Tensor('float32', obs, [1, want]),
    mask: new ort.Tensor('bool', mask, [1, ACTION_DIM]),
  });
  const logits = out.logits.data;
  let best = -1, bv = -Infinity;
  for (let i = 0; i < ACTION_DIM; i++)
    if (mask[i] && logits[i] > bv) { bv = logits[i]; best = i; }
  return best;
}

const api = { OBS_DIM, ACTION_DIM, encodeObs, legalMask, actionToEngine, chooseAction, modelObsDim,
              cidx, idxCard, setAblateFrev, setFriendCallFix };
if (typeof module !== 'undefined' && module.exports) module.exports = api;
else window.MightyMaster = api;

})();

})();

<script>

/* mighty-analysis.js — v2 AI 복기: 하이라이트 판정 엔진 (UI 독립, node 테스트 가능)
 *
 * 판정 원칙 (docs/V2-PLAN.md):
 *  - 스크리닝은 가치 헤드 ΔEV, 확정은 같은 국면 페어드 롤아웃.
 *  - 대상은 인간 좌석의 플레이 페이즈 결정만 (입찰·프렌드 지정은 보류).
 *  - 등급: 결정적(승패 다수 뒤집힘) / 손해(상금차>=100) / 부정확(극단만, >=60).
 *  - 로컬 게임이라 분석 시점 완전 정보 시뮬레이션 가능. 마스터는 오라클이 아니므로
 *    롤아웃 표본·뒤집힘 비율을 결과에 그대로 담아 UI가 표기한다.
 */
(function () {
'use strict';
const IS_NODE = (typeof module !== 'undefined' && module.exports);
const E = IS_NODE ? require('./mighty-engine.js') : window.MightyEngine;
const M = IS_NODE ? require('./mighty-master.js') : window.MightyMaster;
// 지연 해석 — 번들에서 analysis가 ai보다 먼저 로드되므로 즉시 참조하면 undefined
const getAI = () => (IS_NODE ? require('./mighty-ai.js') : window.MightyAI);

const GRADE = { CRITICAL: '결정적', LOSS: '손해', SLIP: '부정확' };
// SLIP 80: 정밀도 벤치에서 60은 검증 통과율이 낮았다(표본 4건 중 1건) — 더 극단만 표시
const TH = { LOSS: 100, SLIP: 80, FLIP_HI: 2 / 3, FLIP_LO: 1 / 3 };
// 페어드 롤아웃의 샘플링 온도. 배포는 argmax(T=0)인데 롤아웃만 T=1이면 양 팔
// 모두 실전보다 약하게 둔다 — 그 괴리가 오탐으로 나온다. v2.9.0에서 0.5로
// 내렸다(정밀도 벤치 250판×2 독립 배치, docs/rollout-temp.txt):
//   T=1   결정적 8/9 · 손해 84/94 · 부정확 4/8 → 오탐 15/111
//   T=0.5 결정적 10/10 · 손해 92/98 · 부정확 2/2 → 오탐 8/110
// 두 배치 모두 개선, 악화 지표 없음. 0에 더 붙이지 않는 이유는 롤아웃이
// 불확실성 표본이기도 해서다 — 완전 결정론이면 n=24가 같은 라인 24개가 된다.
// 연구용 덮어쓰기: env ROLL_T.
const ROLL_TEMP = (IS_NODE && process.env.ROLL_T) ? parseFloat(process.env.ROLL_T) : 0.5;

function rebuild(rec, upto) {
  const g = new E.MightyGame(rec.cfg);
  g.start(rec.dealer);
  const n = (upto === undefined) ? rec.actions.length : upto;
  for (let i = 0; i < n; i++) g.act(rec.actions[i].a);
  return g;
}

/** 인간 좌석의 플레이 결정 인덱스 목록 */
function playDecisions(rec, seat) {
  const out = [];
  for (let i = 0; i < rec.actions.length; i++) {
    const x = rec.actions[i];
    if (x.p === seat && x.ph === 'play' && x.a && x.a.type === 'play') out.push(i);
  }
  return out;
}

async function infer(sess, ort, g, seat) {
  const obs = M.encodeObs(g, seat);
  const mask = M.legalMask(g);
  const want = M.modelObsDim(sess);
  const o = obs.length === want ? obs : obs.slice(0, want);
  const r = await sess.run({
    obs: new ort.Tensor('float32', o, [1, want]),
    mask: new ort.Tensor('bool', mask, [1, M.ACTION_DIM]),
  });
  return { logits: r.logits.data, value: r.value ? r.value.data[0] : 0, mask };
}

/**
 * 마스크된 소프트맥스 샘플 (rng: () => [0,1)).
 * temp<1이면 분포를 배포 경로(argmax)에 가깝게 죈다 — 롤아웃이 실전보다 약하게
 * 두는 편향을 줄인다. 기본값은 ROLL_TEMP.
 */
function sampleIdx(logits, mask, rng, temp = ROLL_TEMP) {
  const t = (temp > 0 ? temp : 1);
  let mx = -Infinity;
  for (let i = 0; i < mask.length; i++) if (mask[i] && logits[i] > mx) mx = logits[i];
  let z = 0; const p = new Float64Array(mask.length);
  for (let i = 0; i < mask.length; i++) if (mask[i]) { p[i] = Math.exp((logits[i] - mx) / t); z += p[i]; }
  let u = rng() * z;
  for (let i = 0; i < mask.length; i++) if (mask[i]) { u -= p[i]; if (u <= 0) return i; }
  for (let i = mask.length - 1; i >= 0; i--) if (mask[i]) return i;
  return -1;
}

function greedyIdx(logits, mask) {
  let b = -1, bv = -Infinity;
  for (let i = 0; i < mask.length; i++) if (mask[i] && logits[i] > bv) { bv = logits[i]; b = i; }
  return b;
}

/** 현 국면부터 전 좌석 마스터로 플레이아웃. greedy=true면 결정론(고스트 라인용). */
async function playout(sess, ort, g, { rng = null, record = null, maxSteps = 400 } = {}) {
  let steps = 0;
  while (g.phase !== 'done' && g.phase !== 'redeal' && steps++ < maxSteps) {
    const p = g.currentPlayer;
    const { logits, mask } = await infer(sess, ort, g, p);
    const ai = rng ? sampleIdx(logits, mask, rng) : greedyIdx(logits, mask);
    let act = M.actionToEngine(ai, g, []);
    if (!act) throw new Error('playout: 액션 변환 실패 idx=' + ai);
    // 배포 마스터의 최종 경로와 동일하게 — 가드 미적용 시뮬은 실제로 나오지
    // 않을 낭비 수를 라인에 섞는다 (코칭 정합 버그와 같은 계열)
    if (act.type === 'play') act = await getAI().applyGuards(sess, ort, g, p, act);
    if (record) record.push({ p, ph: g.phase, a: JSON.parse(JSON.stringify(act)) });
    g.act(act);
  }
  return g;
}

/** 플레이 액션 → 정책 액션 인덱스 (플레이 페이즈 전용) */
function playActionIdx(a) {
  if (a.jokerCall) return 206;                       // A_PLAY_JOKERCALL
  if (E.isJoker(a.card)) return a.jokerSuit ? 201 + ['S','D','H','C'].indexOf(a.jokerSuit) : 205;
  return 149 + M.cidx(a.card);
}

/**
 * 1단계 스크리닝 — 결정별 EV 곡선과 ΔEV(정책 상위 대안 대비).
 * 반환 decisions[k]: {idx, trick, actual, v, vAfterAct, altIdx, vAfterAlt, dEV}
 */
async function screenRound(sess, ort, rec, seat, { tick } = {}) {
  const idxs = playDecisions(rec, seat);
  const out = [];
  for (const idx of idxs) {
    const g = rebuild(rec, idx);
    if (g.phase !== 'play' || g.currentPlayer !== seat) continue;
    const trick = g.play.trickNo;
    const { logits, value, mask } = await infer(sess, ort, g, seat);
    const actualA = rec.actions[idx].a;
    const actIdx = playActionIdx(actualA);
    // 후보: 실제 수 + 정책 상위 2개 (실제 수 제외)
    const cands = [];
    const order = [];
    for (let i = 0; i < mask.length; i++) if (mask[i]) order.push(i);
    order.sort((a, b) => logits[b] - logits[a]);
    for (const i of order) { if (i !== actIdx && cands.length < 2) cands.push(i); }
    const after = async (ai) => {
      const g2 = rebuild(rec, idx);
      const act = M.actionToEngine(ai, g2, []);
      if (!act) return null;
      g2.act(act);
      if (g2.phase === 'done') return g2.result.prizes[seat] / 2000;
      if (g2.phase === 'redeal') return 0;
      return (await infer(sess, ort, g2, seat)).value;
    };
    const vAct = await after(actIdx);
    let best = null;
    for (const c of cands) {
      const v = await after(c);
      if (v !== null && (best === null || v > best.v)) best = { idx: c, v };
    }
    out.push({
      idx, trick, actual: actualA, actIdx, v: value,
      vAfterAct: vAct,
      altIdx: best ? best.idx : null,
      vAfterAlt: best ? best.v : null,
      dEV: (best && vAct !== null) ? (best.v - vAct) : 0,
    });
    if (tick) await tick();
  }
  return out;
}

/** 2단계 — 같은 국면 페어드 롤아웃 (실제 수 vs 대안 수) */
async function rolloutPair(sess, ort, rec, seat, idx, altIdx, { n = 24, seed = 7, tick, keepLines = false } = {}) {
  const arms = { act: [], alt: [] };
  const altLines = [];
  const actIdx = playActionIdx(rec.actions[idx].a);
  for (let r = 0; r < n; r++) {
    for (const [arm, ai] of [['act', actIdx], ['alt', altIdx]]) {
      const g = rebuild(rec, idx);
      const first = M.actionToEngine(ai, g, []);
      if (!first) { arms[arm].push(null); continue; }
      const record = (keepLines && arm === 'alt')
        ? [{ p: seat, ph: 'play', a: JSON.parse(JSON.stringify(first)) }] : null;
      g.act(first);
      if (g.phase !== 'done' && g.phase !== 'redeal')
        await playout(sess, ort, g, { rng: E.makeRng(seed * 1000003 + r), record });
      const pz = g.phase === 'done' ? g.result.prizes[seat] : 0;
      arms[arm].push(pz);
      if (record) altLines.push({ prize: pz, actions: record,
        result: g.phase === 'done' ? g.result : null });
    }
    if (tick) await tick();
  }
  const stat = (xs) => {
    const v = xs.filter(x => x !== null);
    const mean = v.reduce((a, b) => a + b, 0) / v.length;
    return { mean, win: v.filter(x => x > 0).length, n: v.length };
  };
  return { act: stat(arms.act), alt: stat(arms.alt), altLines };
}

function classify(ro) {
  const d = ro.alt.mean - ro.act.mean;
  const flip = (ro.alt.win / ro.alt.n >= TH.FLIP_HI) && (ro.act.win / ro.act.n <= TH.FLIP_LO);
  if (flip) return { grade: GRADE.CRITICAL, dPrize: d };
  if (d >= TH.LOSS) return { grade: GRADE.LOSS, dPrize: d };
  if (d >= TH.SLIP) return { grade: GRADE.SLIP, dPrize: d };
  return null;
}

/** 대안 수 이후 결정론 라인 — 복기 화면에서 고스트 재생용 */
async function ghostLine(sess, ort, rec, seat, idx, altIdx) {
  const g = rebuild(rec, idx);
  const first = M.actionToEngine(altIdx, g, []);
  if (!first) return null;
  const tail = [{ p: seat, ph: 'play', a: JSON.parse(JSON.stringify(first)) }];
  g.act(first);
  if (g.phase !== 'done' && g.phase !== 'redeal')
    await playout(sess, ort, g, { record: tail });
  return {
    actions: rec.actions.slice(0, idx).concat(tail),
    result: g.phase === 'done' ? g.result : null,
  };
}

function cardName(a) {
  if (a.jokerCall) return E.cardName(a.card) + '(조커콜)';
  if (E.isJoker(a.card)) return '조커' + (a.jokerSuit ? `(${a.jokerSuit})` : '');
  return E.cardName(a.card);
}

function idxCardName(ai, g) {
  const act = M.actionToEngine(ai, g, []);
  return act ? cardName(act) : '?';
}

/**
 * 전체 파이프라인. opts.tick: 청크 양보 콜백(UI 프레임 유지),
 * opts.topK: 롤아웃 확정 대상 수, opts.n: 암당 롤아웃 수.
 * 반환: {evCurve, decisions, highlights}
 */
async function analyzeRound(sess, ort, rec, seat, opts = {}) {
  const { topK = 5, n = 24, seed = 7, tick = null, onProgress = null } = opts;
  const decisions = await screenRound(sess, ort, rec, seat, { tick });
  const evCurve = decisions.map(d => ({ idx: d.idx, trick: d.trick, v: d.v }));
  const suspects = decisions.filter(d => d.altIdx !== null && d.dEV > 0.02)
    .sort((a, b) => b.dEV - a.dEV).slice(0, topK);
  const highlights = [];
  let done = 0;
  for (const s of suspects) {
    const ro = await rolloutPair(sess, ort, rec, seat, s.idx, s.altIdx, { n, seed, tick, keepLines: true });
    const cls = classify(ro);
    if (onProgress) onProgress(++done, suspects.length);
    if (!cls) continue;
    const g = rebuild(rec, s.idx);
    // 고스트 = 가드 포함 argmax 반사실 라인 — "대안 수를 두고 실제 AI들이
    // 그대로 이어갔다면"의 결정론 라인. 실제 라인(역시 argmax+가드 진행)과
    // 같은 강도의 비교라 공정하다. 샘플링 롤아웃(T=ROLL_TEMP)은 양 팔 모두
    // 실전보다 약하게 두므로 등급 판정(평균 비교)에만 쓰고 재생 라인으론 쓰지 않는다.
    const ghost = await ghostLine(sess, ort, rec, seat, s.idx, s.altIdx);
    // 반사실 라인의 실제 이득 — 사용자에게 약속하는 수치는 이것이다.
    // 시뮬 평균(dPrize)은 샘플링 세계의 페어드 차이라 등급 판정에는 옳지만
    // "실제 대비 이득" 예측으로는 과대다(실플레이 캘리브레이션: 약속 +949 대
    // 라인 실이득 +38). 라인이 실제보다 좋아지는 하이라이트만 노출한다.

    return (alt && alt.type === 'play') ? alt : action;
  } catch (e) { return action; }
}

/**
 * 조커콜 자해 가드 — 프렌드 카드로 '조커'를 지목한 판에서 여당 좌석(주공·공개
 * 프렌드)이 조커콜을 선언하면 **선언만 뗀다**(같은 카드를 그냥 리드).
 *
 * 조커를 프렌드로 부른 것은 "조커 보유자가 내 편"이라는 공개 선언이다. 거기서
 * 조커콜은 아군의 2인자 카드를 최약 취급(서열 −1)으로 강제 소모시키고, 콜 카드가
 * 그 무늬 최저라 트릭까지 상대에 넘긴다. 야당의 조커콜은 아군 조커를 뽑는 정당한
 * 수라 제외한다.
 *
 * 제보 2026-08-10 seed 573961911 트릭3 — 주공이 조커 프렌드를 부른 뒤 ♣3 조커콜,
 * 프렌드 조커가 소모되고 트릭은 야당이 가져갔다. v7·v8·v9가 이 국면에서 조커콜을
 * 1순위(40~47%)로 고른다.
 *
 * 인증(v9, 20,000시드 강제 페어드 · docs/jcall-cert.txt): 발화 판 주공 상금
 * **+1,101±254** (n=329) · 여당 승수 +54. 자연 발화율은 기회의 7.0%.
 * 롤백: createAgent({jcallGuard:false}).
 */
function jokerCallGuard(game, seat, action) {
  try {
    if (!action || action.type !== 'play' || !action.jokerCall) return action;
    if (game.phase !== 'play') return action;
    const fd = game.friendDecl;
    if (!fd || fd.mode !== 'card' || !fd.card || !E.isJoker(fd.card)) return action;
    if (game.hands[seat].some(c => E.isJoker(c))) return action;   // 내가 조커 보유 = 다른 국면
    const ruling = seat === game.declarer ||
                   (game.friendRevealed && game.friend !== null && seat === game.friend);
    if (!ruling) return action;
    // 같은 카드를 콜 없이 낼 수 있을 때만 — 없으면 손대지 않는다
    if (!game._legalPlays(seat).some(m => !m.jokerCall && E.sameCard(m.card, action.card)))
      return action;
    return { type: 'play', card: action.card };
  } catch (e) { return action; }
}

/**
 * 확정승 컷 가드 — 공개 후, 리드 무늬 보이드인 좌석이 상대팀이 최강인 점수
 * 트릭을 두고 비기루다 버림을 선택하면, '가시 확정승'인 최저 기루다 컷으로
 * 교체한다. keyCardGuard(아끼기)의 역방향 — 먹어야 할 때 먹는다.
 * 인증(v7, 1,600시드 페어드): 발화 좌석 상금 +533±166, 두 배치 단독 유의
 * (+401±265 / +634±210 — docs/c5-cert.txt). 제보 seed 746746024 트릭7
 * (♠6 버림 대 ♦6 컷, +1,150/판)에서 출발. 교사 결정론 — 차기 증류 클래스.
 * v2.9.2에서 **공개 전 구간으로 확장**했다. 공개 전에는 팀을 모르지만, 확정
 * 야당(비주공이면서 카드 프렌드를 자기가 안 든 좌석)은 "주공이 최강인 트릭 =
 * 상대 트릭"임을 좌석 가시 정보만으로 안다. 인증(v9, 48,000시드 페어드):
 * 발화 좌석 상금 **+386±134**(n=161) 유의 이득 — docs/c5p-cert.txt.
 * 제보 2026-08-10: 트릭1에서 야당이 스페이드 보이드인데 기루다 컷 대신 클럽을
 * 버려 주공에게 트릭을 넘겼고, 리드를 못 잡아 조커콜 기회까지 날렸다.
 * 롤백: createAgent({cutGuard:false}).
 */
function cutGuard(game, seat, action) {
  try {
    if (!action || action.type !== 'play' || game.phase !== 'play'
        || action.jokerCall) return action;
    const pl = game.play;
    if (!pl || !pl.table.length) return action;
    const gi = game.contract ? game.contract.giruda : 'N';
    if (gi === 'N') return action;
    const c = action.card;
    if (E.isJoker(c) || E.sameCard(c, game.mightyCard)) return action;
    if (c.suit === gi || pl.ledSuit === gi) return action;         // 이미 컷 / 기루다 팔로우
    if (game.hands[seat].some(x => !E.isJoker(x) && x.suit === pl.ledSuit)) return action;
    if (pl.table.filter(e => E.isPointCard(e.card)).length < 1) return action;
    const gt = (a, b) => a[0] > b[0] || (a[0] === b[0] && a[1] > b[1]);
    let bk = [-2, -1], bp = -1;
    for (const e of pl.table) {
      const k = game._cardStrength(e, pl);
      if (gt(k, bk)) { bk = k; bp = e.player; }
    }
    if (game.friendRevealed) {
      const iAmRuling = seat === game.declarer || seat === game.friend;
      const bestRuling = bp === game.declarer || (game.friend !== null && bp === game.friend);
      if (iAmRuling === bestRuling) return action;                 // 아군 최강이면 방치 정당
    } else {
      // 공개 전 — 확정 야당만, 그리고 주공이 최강인 트릭에서만 성립한다
      const fd = game.friendDecl;
      const holdsFriendCard = fd && fd.mode === 'card' && fd.card &&
        game.hands[seat].some(x => E.sameCard(x, fd.card));
      if (seat === game.declarer || holdsFriendCard) return action;
      if (bp !== game.declarer) return action;
    }
    const seen = new Set();
    for (const t of pl.history) for (const e of t.plays) seen.add(E.cardId(e.card));
    for (const e of pl.table) seen.add(E.cardId(e.card));
    for (const x of game.hands[seat]) seen.add(E.cardId(x));
    if (seat === game.declarer && game.discard) for (const x of game.discard) seen.add(E.cardId(x));
    const acted = new Set(pl.table.map(e => e.player)); acted.add(seat);
    let remaining = 0;
    for (let p = 0; p < E.NUM_PLAYERS; p++) if (!acted.has(p)) remaining++;
    const cfg = game.config || {};
    const jokerCanWin = !pl.jokerCallActive &&
      !(pl.trickNo === 1 && cfg.firstTrickJokerWeak !== false) &&
      !(pl.trickNo >= 10 && cfg.lastTrickJokerWeak !== false);
    const threats = [];
    if (remaining > 0) {
      if (!seen.has(E.cardId(game.mightyCard))) threats.push([4, 0]);
      if (jokerCanWin && !seen.has(E.JOKER)) threats.push([3, 0]);
      for (let r = 2; r <= 14; r++) if (!seen.has(gi + r)) threats.push([2, r]);
    }
    const myTr = game.hands[seat]
      .filter(x => !E.isJoker(x) && x.suit === gi && !E.sameCard(x, game.mightyCard))
      .sort((a, b) => a.rank - b.rank);
    for (const tc of myTr) {
      const k = game._cardStrength({ player: seat, card: tc }, pl);
      if (!gt(k, bk)) continue;
      if (threats.some(t => gt(t, k))) continue;                   // 뒤 위협에 잡힘
      if (!game._legalPlays(seat).some(m => !m.jokerCall && E.sameCard(m.card, tc))) continue;
      return { type: 'play', card: tc };                           // 최저 확정승 컷
    }
    return action;
  } catch (e) { return action; }
}

/**
 * 배포 가드 체인 — 정책 argmax 결과에 후처리 가드를 정해진 순서로 적용한다.
 * 실플레이 에이전트·코칭·AI 복기 시뮬이 **전부 이 함수 하나**를 쓴다. 체인을
 * 세 곳에 복사해 두면 한 곳만 구버전으로 남는다(코칭 정합 버그 실적).
 *
 * 가드별로 opts.xxxGuard=false로 끈다. c1Guard만 반대로 기본 OFF다 —
 * v9 가드 스윕에서 이득 근거가 소멸(−92±261 중립)했고 발화 시 재추론 비용만
 * 남아서, 켜려면 명시적으로 {c1Guard:true}를 준다(docs/GUARDS.md).
 *
 * opts.guardCount에 객체를 주면 가드별 발화 횟수를 센다(진단 전용,
 * tools/research/guard_fire.js).
 */
async function applyGuards(session, ort, game, seat, action, opts = {}) {
  const cnt = opts.guardCount || null;
  const tally = (name, before, after) => {
    if (cnt && before !== after) cnt[name] = (cnt[name] || 0) + 1;
    return after;
  };
  // 조커콜 가드가 먼저다 — 뒤 가드들이 조커콜 액션을 그냥 통과시키기 때문에
  // 여기서 선언을 떼어 놓아야 이후 검사가 일반 리드로 이어진다.
  let x = (opts.jcallGuard === false ? action
    : tally('jcall', action, jokerCallGuard(game, seat, action)));
  x = (opts.keyGuard === false ? x
    : tally('key', x, keyCardGuard(game, seat, x, opts.guardTrace)));
  if (opts.topGuard !== false) x = tally('top', x, topLeadGuard(game, seat, x));
  if (opts.feedGuard !== false) x = tally('tfeed', x, tfeedGuard(game, seat, x));
  if (opts.cutGuard !== false) x = tally('cut', x, cutGuard(game, seat, x));
  if (opts.dleadGuard !== false) x = tally('dlead', x, await dleadGuard(session, ort, game, seat, x));
  if (opts.c1Guard === true) x = tally('c1', x, await c1Guard(session, ort, game, seat, x));
  return x;
}

/** onnxruntime 세션 생성 (마스터 티어 전용). ort는 호출자가 넘긴다. */
async function loadMaster(ort, modelPath = 'mighty_master_v4.onnx') {
  return ort.InferenceSession.create(modelPath);
}

/**
 * 좌석에 앉힐 에이전트를 만든다.
 * 반환 객체의 act(game, seat)는 항상 엔진에 그대로 넣을 수 있는 액션을 돌려준다
 * (바닥패 교환의 부분 선택은 내부에서 3장까지 모아 처리).
 */
async function createAgent(opts = {}) {
  const { tier = 'intermediate', persona = 'balanced', rng = Math.random,
          session = null, ort = null, revealPersona = false } = opts;
  if (!TIERS.includes(tier)) throw new Error('unknown tier: ' + tier);

  if (tier === 'master') {
    if (!session || !ort) throw new Error('master 티어에는 {session, ort}가 필요하다');
    const pick = [];
    return {
      tier, label: TIER_LABEL[tier],
      reset() { pick.length = 0; },
      async act(game, seat) {
        if (seat === undefined) seat = game.currentPlayer;
        for (let guard = 0; guard < 8; guard++) {
          const a = await M.chooseAction(session, ort, game, seat, pick);
          const act = M.actionToEngine(a, game, pick);
          // null이면 교환 카드 누적 중 → 다시 고른다
          if (act) return applyGuards(session, ort, game, seat, act, opts);
        }
        throw new Error('master: 액션 확정 실패');
      },
    };
  }

  const agent = new E.HeuristicAgent(E.PERSONAS[persona], rng, { tier });
  return {
    tier, label: TIER_LABEL[tier],
    // 성향은 기본적으로 감춘다 — 화면에 새어나가면 상대를 읽는 단서가 된다.
    ...(revealPersona ? { persona } : {}),
    reset() {},
    async act(game) { return agent.act(game); },
  };
}

/** 학습·배포 표준 성향 3종. team·loner는 하위호환용이라 배정에서 뺀다. */
const PERSONA_KEYS = ['gambler', 'balanced', 'careful'];

/**
 * 매치 단위 좌석 배정표. 좌석마다 성향을 무작위로 뽑아 매치 내내 고정한다.
 * 라운드가 바뀌어도 같은 좌석은 같은 성향이고, 새 게임에서 다시 부르면 새로 뽑힌다.
 * 좌석별 성향은 table.personas로만 볼 수 있다(진단·재현용, UI 노출 금지).
 *
 * opts.tiers  좌석별 티어 배열 또는 단일 문자열
 * opts.personas  배정을 직접 지정(재현용). 생략하면 무작위.
 */
async function createTable(opts = {}) {
  const { tiers = 'advanced', rng = Math.random, session = null, ort = null,
          personas = null, revealPersona = false, sessions = null } = opts;
  const seats = opts.seats || E.NUM_PLAYERS;
  const tierAt = s => (Array.isArray(tiers) ? tiers[s] : tiers);
  const assigned = [], agents = [];
  for (let s = 0; s < seats; s++) {
    const tier = tierAt(s);
    // 마스터는 성향 개념이 없다
    const persona = tier === 'master' ? null
      : (personas ? personas[s] : PERSONA_KEYS[Math.floor(rng() * PERSONA_KEYS.length)]);
    assigned.push(persona);
    // v2.8: 혼합 운영 — 좌석별 모델 세션(성향차)을 허용한다
    agents.push(await createAgent({ tier, persona: persona || 'balanced',
                                    rng, session: (sessions && sessions[s]) || session,
                                    ort, revealPersona }));
  }
  return {
    seats, agents,
    personas: assigned.slice(),
    /** 라운드 시작 시 호출 — 좌석 배정은 그대로 두고 내부 버퍼만 비운다. */
    reset() { for (const a of agents) if (a.reset) a.reset(); },
  };
}

const api = { createAgent, createTable, loadMaster, applyGuards,
              keyCardGuard, topLeadGuard, tfeedGuard, dleadGuard, c1Guard, cutGuard,
              jokerCallGuard,
              TIERS, TIER_LABEL, PERSONA_KEYS };
if (typeof module !== 'undefined' && module.exports) module.exports = api;
else window.MightyAI = api;

})();

function t(s){ return (LANG==='en' && I18N_EN[s]!==undefined) ? I18N_EN[s] : s; }
function setLang(L){
  if (L!==LANG){
    LANG = L;
    settings.ui.lang = L;
    document.documentElement.lang = L;
    applyNames(); applyStatic(); saveSettings();
    if (typeof render==='function' && game) render();
    renderLanding();
  }
  if ($('#settings').classList.contains('show')) renderSettings();
  applyStatic();
}
/** 정적 DOM 문구(시작 화면·헤더 등) 갱신 */
function applyStatic(){
  const set=(sel,txt)=>{ const e=$(sel); if(e) e.textContent=txt; };
  set('#log-btn', t('기록'));
  set('#set-btn', t('룰 설정'));
  const cb=$('#cheat-btn'); if(cb) cb.innerHTML=(cheatOpen?t('시트 닫기'):t('시트'))+'<span class="kb">C</span>';
  const ub=$('#undo-btn'); if(ub) ub.innerHTML=t('되돌리기')+'<span class="kb">Z</span>';
  const rb=$('#replay-btn'); if(rb) rb.innerHTML=t('복기')+'<span class="kb">R</span>';
  set('#start-btn', t('매치 시작'));
  set('#start-set-btn', t('룰 설정'));
  set('#set-done', t('완료'));
  set('#set-reset', t('리그 룰로 초기화'));
  const lg=$('#log header span'); if(lg) lg.textContent=t('진행 기록');
  set('#hud .title', LANG==='en' ? 'MIGHTY' : '마이티');
  const h1=$('#start .inner h1'); if(h1) h1.textContent = LANG==='en' ? 'MIGHTY' : '마이티';
  const en=$('#start .en'); if(en) en.textContent = LANG==='en' ? 'FIVE-PLAYER TRICK TAKING' : 'MIGHTY · SOLO TABLE';
  const sh=$('#settings h2'); if(sh) sh.childNodes[0].nodeValue=t('룰 설정')+' ';
  const p=$('#start .inner p');
  if(p) p.innerHTML = t('5인 트릭테이킹의 정석, 마이티.')+'<br>'+
    t('당신과 네 명의 컴퓨터 플레이어가 한 테이블에 앉습니다.')+'<br>'+
    t('공약을 선언하고, 프렌드를 찾고, 판을 지배하세요.');
  document.querySelectorAll('.app-ver').forEach(e=>{ e.textContent = APP_VERSION + ' · ' + APP_BUILD; });
}

const store = {
  async get(k){
    try{ if (window.storage){ const r = await window.storage.get(k); if (r) return r; } }catch(e){}
    try{ const v = localStorage.getItem(k); return v ? {value:v} : null; }catch(e){ return null; }
  },
  async set(k, v){
    try{ if (window.storage){ await window.storage.set(k, v); return; } }catch(e){}
    try{ localStorage.setItem(k, v); }catch(e){}
  },
};
async function saveSettings(){
  try{ await store.set('mighty-settings', JSON.stringify(settings)); }catch(e){}
}
async function loadSettings(){
  try{
    const r = await store.get('mighty-settings');
    if (r && r.value){
      const s = JSON.parse(r.value);
      const d = defaultSettings();
      if (s.ui && TIER_OF[s.ui.difficulty]) s.ui.difficulty = TIER_OF[s.ui.difficulty];  // v0.14 티어 이관
      settings = { ...d, ...s,
        names:(Array.isArray(s.names)&&s.names.length===5)?s.names:d.names,
        match:{...d.match, ...(s.match||{})}, ui:{...d.ui, ...(s.ui||{})},
        engine:{...d.engine, ...(s.engine||{}), scoring:{...d.engine.scoring, ...((s.engine||{}).scoring||{})}} };
    }
  }catch(e){}
}
function applyPreset(key){

function segRow(label, sub, options, get, set){
  const row = el('div','set-row');
  row.append(el('div','lbl', label + (sub?`<small>${sub}</small>`:'')));
  const seg = el('div','seg');
  for (const o of options){
    const b = el('button','', o.l); if (String(get())===String(o.v)) b.classList.add('on');
    b.onclick = () => { set(o.v); settings.preset='custom'; saveSettings(); renderSettings(); };
    seg.append(b);
  }
  row.append(seg); return row;
}
function stepRow(label, sub, get, set, min, max, step, fmt){
  const row = el('div','set-row');
  row.append(el('div','lbl', label + (sub?`<small>${sub}</small>`:'')));
  const st = el('div','stepper');
  const minus = el('button','','−'), plus = el('button','','+');
  const val = el('div','val', (fmt||(x=>x))(get()));
  minus.onclick = () => { set(Math.max(min, get()-step)); settings.preset='custom'; saveSettings(); renderSettings(); };
  plus.onclick  = () => { set(Math.min(max, get()+step)); settings.preset='custom'; saveSettings(); renderSettings(); };
  st.append(minus,val,plus); row.append(st); return row;
}

const TIER_OF = { normal:'intermediate', hard:'advanced', easy:'intermediate',
                  intermediate:'intermediate', advanced:'advanced', master:'master' };

/* 혼합 운영 — 상호 대결 동등이 실증된 세대를 좌석 성향차로 섞는다.
 * 플레이 중 비노출(비딩 읽힘 방지 — 페르소나와 같은 원칙), 매치 종료 화면에서
 * 사후 공개. 코칭·AI 복기 판정은 항상 대표(MASTER_MODEL=v13).
 * v2.10: 좌석 배분을 추첨에서 **고정 배분 후 섞기**로 바꿨다 — 네 좌석에
 * 선견가(v13) 둘, 책사(v9) 하나, 수문장(v8) 하나. 추첨이면 한 세대가 네 좌석을
 * 모두 차지하는 판이 생겨 성향차라는 취지가 흐려진다. */
const MASTER_POOL=[
  { id:'v13', file:'./model/mighty_master_v13.onnx', nick:'선견가' },
  { id:'v9', file:'./model/mighty_master_v9.onnx', nick:'책사' },
  { id:'v8', file:'./model/mighty_master_v8.onnx', nick:'수문장' },
];
const SEAT_PLAN=['v13','v13','v9','v8'];     // AI 좌석 4개에 배분할 모델
let masterSessions={};                       // id → onnx session (지연 로드 캐시)
let seatModels=[null,null,null,null,null];   // AI 좌석별 pool id — 매치 내 고정
function poolOf(id){ return MASTER_POOL.find(m=>m.id===id); }
async function loadPoolModel(id){
  if (masterSessions[id]) return masterSessions[id];
  const m=poolOf(id);
  masterSessions[id]=await MightyAI.loadMaster(ortLib, m.file);
  return masterSessions[id];
}
/** 매치 시작 시 AI 좌석 모델 추첨 + 필요 모델 지연 로드 */
async function assignSeatModels(){
  const plan=SEAT_PLAN.slice();
  for(let i=plan.length-1;i>0;i--){          // 피셔-예이츠 — 좌석 순서만 섞는다
    const j=Math.floor(Math.random()*(i+1));
    [plan[i],plan[j]]=[plan[j],plan[i]];
  }
  for(let p=1;p<5;p++) seatModels[p]=plan[p-1];
  await Promise.all([...new Set(seatModels.slice(1))].map(loadPoolModel));
}
const ORT_LOCAL='./ort/ort.wasm.min.js';                      // 번들 동봉(오프라인 가능)
const ORT_CDN='https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js';
function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=src; s.onload=res; s.onerror=()=>rej(new Error('script load failed'));
    document.head.appendChild(s);
  });
}
async function ensureMaster(){
  if (masterState==='ready'||masterState==='loading') return masterState==='ready';
  masterState='loading'; renderSettings();
  toast(t('마스터 AI 로딩 중… (최초 1회, 약 16MB)'), 2600);
  try{
    if (!window.ort){
      try{ await loadScript(ORT_LOCAL); }         // 로컬 번들 우선
      catch(e){ await loadScript(ORT_CDN); }      // 없으면 CDN 폴백
    }
    ortLib=window.ort;
    if (!ortLib) throw new Error('onnxruntime unavailable');
    try{
      ortLib.env.wasm.wasmPaths = new URL('./ort/', document.baseURI).href;
      ortLib.env.wasm.numThreads = 1;            // COOP/COEP 헤더 없는 정적 호스팅 대응
    }catch(e){}
    masterSess=await MightyAI.loadMaster(ortLib, MASTER_MODEL);
    masterSessions['v13']=masterSess;                // 대표 모델은 풀 캐시와 공유
    if (!seatModels[1]) await assignSeatModels();    // 최초 로드 시 좌석 배정
    masterState='ready';
    await buildAgents();
    toast(t('마스터 AI 준비 완료'), 1600);
  }catch(e){
    masterState='failed';
    await buildAgents();
    toast(t('마스터 AI 로드 실패 — 고급 전략으로 진행합니다'), 2600);
  }
  renderSettings();
  return masterState==='ready';
}
function masterActive(){ return currentTier()==='master'; }
function currentTier(){
  const d = settings.ui.difficulty || 'intermediate';
  const tier = TIER_OF[d] || 'intermediate';
  if (tier==='master' && masterState!=='ready') return 'advanced';   // 폴백
  return tier;
}
async function buildAgents(reassign){
  const tier = currentTier();
  if (reassign || !botTable || botTable.tier !== tier){
    // v2.8 혼합 운영 — 마스터 티어는 좌석별 배정 모델 세션 사용 (미배정/미로드는 대표로 폴백)
    const sessions = tier==='master'
      ? [null,1,2,3,4].map((_,p)=>p===0?null:(masterSessions[seatModels[p]]||masterSess))
      : null;
    botTable = await MightyAI.createTable({
      tiers: [tier, tier, tier, tier, tier],
      rng: Math.random, session: masterSess, ort: ortLib, sessions,
    });
    botTable.tier = tier;
  }
  for (let p=1; p<5; p++) agents[p] = botTable.agents[p];
  agentsReady = true;
}

  }
  const d=el('div','cardface '+suCls(c.suit));

  d.append(el('div','idx',`${rn}<small>${SUIT_GLYPH[c.suit]}</small>`), el('div','pip',SUIT_GLYPH[c.suit]));

function suitHtml(g){ return g==='N' ? '<b>노기루다</b>' : `<b class="${SUIT_RED[g]?'':''}">${SUIT_GLYPH[g]}</b>`; }
function contractText(ct){ return ct ? `${ct.count}${gLabel(ct.giruda)}` : ''; }
function g2ko(g){ return {S:'♠',D:'♦',H:'♥',C:'♣',N:'노'}[g]; }
function sortHand(h){
  const order={S:0,D:1,C:2,H:3};
  return h.slice().sort((a,b)=>{
    if (E.isJoker(a)) return 1; if (E.isJoker(b)) return -1;
    if (a.suit!==b.suit) return order[a.suit]-order[b.suit];
    return b.rank-a.rank;
  });
}

function renderSeats(){
  // 복기 중에는 라이브 게임이 아니라 복기 중인 라운드의 상태를 그린다.
  // (매치 요약·복기에서 다른 판을 열람할 때 주공·프렌드 배지가 라이브 판의
  //  것으로 남아 "역할이 밀려 보이는" 버그의 원인이었다)
  const G = replay ? replay.g : game;
  const inPlay = G && G.phase==='play';
  for(let p=0;p<5;p++){
    const seat=$('#seat-'+p);
    seat.classList.toggle('turn', G && G.currentPlayer===p && G.phase!=='done');
    const meta=$('#meta-'+p);
    if (inPlay){
      meta.textContent=tf('seatMeta', G.play.tricksWon[p], G.play.capturedPoints[p]);
    } else meta.textContent = p!==HUMAN ? t(TIER_LABEL_KO[currentTier()]) : '';
    // 손패 백
    if (p!==HUMAN){
      const bk=$('#backs-'+p); bk.innerHTML='';
      const n=G && G.hands[p] ? G.hands[p].length : 0;
      for(let i=0;i<n;i++) bk.append(el('div','mini'));
    }
    // 배지
    const bd=$('#badges-'+p); bd.innerHTML='';
    if (G && G.declarer===p && G.phase!=='bidding') bd.append(el('span','badge decl',t('주공')));
    if (G && G.friendRevealed && G.friend===p) bd.append(el('span','badge friend',t('프렌드')));
    else if (p===HUMAN && G && G.friendDecl && G.friendDecl.mode==='card' && !G.friendRevealed
             && G.hands[HUMAN].some(c=>E.sameCard(c, G.friendDecl.card)))
      bd.append(el('span','badge friend-secret two', t('프렌드')+'<br>'+t('(비공개)')));
    const tot=totals[p];
    const tb=el('span','badge total'+(tot>0?' plus':tot<0?' minus':''), (tot>0?'+':'')+num(tot));
    bd.append(tb);
    // 획득 점수카드 더미
    const pile=$('#pile-'+p); pile.innerHTML='';
    if (inPlay){
      const cards=G.play.capturedCards[p];
      // 여당(주공·공개된 프렌드)의 더미는 본인에게도 덮어서 표시 (실제 룰)
      const hidden = (p===G.declarer) || (G.friendRevealed && G.friend===p);
      const showFaces = !hidden;
      for(const c of cards){
        if (showFaces){
          const rn={11:'J',12:'Q',13:'K',14:'A'}[c.rank]||c.rank;
          pile.append(el('div','pcard '+suCls(c.suit), `${rn}${SUIT_GLYPH[c.suit]}`));
        } else pile.append(el('div','pcard back','M'));
      }
    }
  }
}

/* ---------------- HUD ---------------- */
function renderHud(){
  const M=settings.match;
  const prog = M.mode==='rounds' ? tf('hudRounds', roundNo, M.rounds)
             : M.mode==='target' ? tf('hudTarget', roundNo, M.targetPrize) : tf('hudPlain', roundNo);
  $('#hud-round').innerHTML = roundNo?tf('hudDealer', prog, NAMES[dealer]):'';
  const ct=game&&game.contract;
  $('#hud-contract').innerHTML = ct?tf('hudContract', contractText(ct), NAMES[game.declarer]):'';
  if (ct) $('#hud-contract').innerHTML += friendDeclText();
  if (game && game.phase==='play'){
    const k=teamPointsKnown();
    $('#hud-score').innerHTML=tf('hudScore', k.ruling, k.friendKnown?'':'+?', k.opp, k.friendKnown?'':'+?', game.play.trickNo);
  } else $('#hud-score').innerHTML='';
}
function teamPointsKnown(){
  // 플레이어(사람) 관점의 공개 정보만 사용: 숨은 프렌드 점수를 유출하지 않음
  const cp=game.play.capturedPoints;
  const known=[game.declarer];
  let ruling=cp[game.declarer], friendKnown=false;
  if (HUMAN===game.declarer && game.discard)
    ruling += game.discard.filter(c=>E.isPointCard(c)).length;  // 여당 귀속 룰: 주공은 묻은 점수 인지
  if (game.friendRevealed){
    if (game.friend!==null){ ruling+=cp[game.friend]; known.push(game.friend); }
    friendKnown=true;
  } else if (game.friendDecl && game.friendDecl.mode==='card' &&
             game.hands[HUMAN].some(c=>E.sameCard(c, game.friendDecl.card))){
    ruling+=cp[HUMAN]; known.push(HUMAN); friendKnown=true; // 내가 숨은 프렌드
  }
  let opp=0, unk=0;
  for(let p=0;p<5;p++){
    if (known.includes(p)) continue;
    if (friendKnown || p===HUMAN) opp+=cp[p]; else unk+=cp[p];
  }
  return {ruling, opp, unk, friendKnown};
}
function friendDeclText(){
  const fd=game.friendDecl;
  if (!fd) return '';
  if (fd.mode==='none') return t(' · 노프렌드');
  if (fd.mode==='first'){
    if (!game.friendRevealed) return tf('fdFirstUnknown');
    return game.friend===null ? t(' · 초구(주공 셀프)') : tf('fdKnown', NAMES[game.friend]);
  }
  if (!game.friendRevealed) return tf('fdHidden', cardLabel(fd.card));
  return game.friend===null ? tf('fdSelf', cardLabel(fd.card))
                           : tf('fdKnownCard', cardLabel(fd.card), NAMES[game.friend]);
}

function renderHand(){

  const sorted=sortHand(game.hands[HUMAN]);
  const phase=game.phase;

      h.classList.add('legal');

function toggleDiscard(c){
  const i=selDiscard.findIndex(s=>E.sameCard(s,c));
  if (i>=0) selDiscard.splice(i,1);
  else if (selDiscard.length<3) selDiscard.push(c);
  renderHand(); renderSheet();
}

    row.append(dm);

async function callFriend(act,label){
  // 보유 카드 호출 = 히든 셀프 플레이 — 실수 방지를 위해 확인만 받고 허용한다

    const gen=stateGen;
    const ok=await confirmModal(t('히든 셀프'),
      tf('selfFriendAsk', cardLabel(act.card)),
      t('히든 셀프로 진행'), t('취소'));
    if (!ok || gen!==stateGen || !game || game.phase!=='friend'
        || game.currentPlayer!==HUMAN) { renderSheet(); return; }
  }
  friendCustom=false;
  humanAct(act, tf('logFriendDecl', NAMES[HUMAN], label));
  const fd=game.friendDecl;
  if (fd.mode==='card') toast(tf('friendCardToast', cardLabel(fd.card)));
}

/* ---------------- 사람 액션 ---------------- */
function humanAct(action, logHtml){
  try{ game.act(action); }
  catch(e){ toast(t('그 수는 둘 수 없습니다')); busy=false; render(); pump(); return; }
  if (logHtml) logLine(logHtml);
  bidSel={giruda:null,count:null};
  render(); pump();
}
async function humanPlay(card){
  const myGen=stateGen;                       // 모달 대기 중 되돌리기·새 라운드가 끼어들 수 있다
  const stale = () => myGen!==stateGen || !game || game.phase!=='play' ||
                      game.play.turn!==HUMAN || !game.hands[HUMAN].some(c=>E.sameCard(c,card));
  if (stale()) return;
  const leading = game.play.table.length===0;
  let action={type:'play', card};
  if (E.isJoker(card) && leading){
    const s=await pickSuit(t('조커 선출 — 요구할 무늬'));
    if (!s || stale()) { render(); pump(); return; }
    action.jokerSuit=s;
  }
  if (leading && E.sameCard(card, game.jokerCallCard) &&
      game._legalPlays(HUMAN).some(m=>m.jokerCall && E.sameCard(m.card,card))){
    // 조커콜이 의미 있는 상황일 때만 묻는다 (조커가 이미 나왔거나 내가 들고 있으면 무의미)
    if (jokerCallUseful()){
      const jc=await confirmModal(t('조커콜'), tf('jokerCallAsk', cardLabel(card)), t('조커콜 선언'), t('그냥 내기'));
      if (jc===null || stale()) { render(); pump(); return; }
      if (jc) action.jokerCall=true;
    }
  }
  // 최종 합법성 재확인 (엔진 예외 대신 조용히 무시)
  const ok = game._legalPlays(HUMAN).some(m =>
    E.sameCard(m.card, action.card) &&
    (!!m.jokerCall === !!action.jokerCall) &&
    (m.jokerSuit===undefined || m.jokerSuit===action.jokerSuit));
  if (!ok){ render(); pump(); return; }
  await playWithAnimation(HUMAN, action);
}

/** 조커콜이 실효성 있는가 — 내 시점 공개 정보만 사용 */
function jokerCallUseful(){
  if (!game || !game.play) return false;
  if (game.hands[HUMAN].some(E.isJoker)) return false;              // 내가 조커 보유 → 무의미
  for (const tr of game.play.history) for (const e of tr.plays) if (E.isJoker(e.card)) return false;
  for (const e of game.play.table) if (E.isJoker(e.card)) return false;   // 이미 출현 → 무의미
  if (HUMAN===game.declarer && game.discard && game.discard.some(E.isJoker)) return false; // 내가 묻음
  return true;
}

let modalResolve = null;         // 열려 있는 모달을 외부에서 취소하기 위한 핸들
function cancelOpenModal(){
  if (modalResolve){ const r=modalResolve; modalResolve=null; $('#modal').classList.remove('show'); r(null); }

function pickSuit(title){
  return new Promise(res=>{
    modalResolve = res;
    const box=$('#modal-box');
    box.innerHTML=`<h2>${title}</h2><div class="sub">${tf('suitFollow')}</div>`;
    const chips=el('div','chips');
    for(const g of ['S','D','H','C']){
      const b=el('button','chip '+suCls(g), SUIT_GLYPH[g]+' '+t({S:'스페이드',D:'다이아',H:'하트',C:'클로버'}[g]));
      b.style.fontSize='1rem';
      b.onclick=()=>{ close(); res(g); };
      chips.append(b);
    }
    const cancel=el('button','btn ghost',t('취소')); cancel.style.marginTop='14px';
    cancel.onclick=()=>{ close(); res(null); };
    box.append(chips,cancel);
    $('#modal').classList.add('show');
    function close(){ modalResolve=null; $('#modal').classList.remove('show'); }
  });
}
function confirmModal(title, html, yes, no){
  return new Promise(res=>{
    modalResolve = res;
    const box=$('#modal-box');
    box.innerHTML=`<h2>${title}</h2><div class="sub">${html}</div>`;
    const row=el('div','btnrow');
    const n=el('button','btn ghost',no); n.onclick=()=>{ close(); res(false); };
    const y=el('button','btn primary',yes); y.onclick=()=>{ close(); res(true); };
    row.append(n,y); box.append(row);
    $('#modal').classList.add('show');
    function close(){ modalResolve=null; $('#modal').classList.remove('show'); }
  });
}

function slotAnchor(p){

async function playWithAnimation(p, action){
  const myGen=stateGen;
  busy=true; renderSheet();
  const completesTrick = game.play.table.length===4;
  const ledBefore = game.play.ledSuit, tlenBefore = game.play.table.length;
  try{ game.act(action); }
  catch(e){ toast(t('그 수는 둘 수 없습니다')); busy=false; render(); pump(); return; }
  const played = action.card;
  // 사운드: 특이 상황 우선순위
  {
    const g=game.contract.giruda;
    if (action.jokerCall) SFX.jokerCall();
    if (E.isJoker(played)) SFX.joker();
    else if (E.sameCard(played, game.mightyCard)) SFX.mighty();
    else if (g!=='N' && played.suit===g){
      if (!trumpSeenThisRound){ trumpSeenThisRound=true; SFX.firstTrump(); }
      else if (tlenBefore>0 && ledBefore && ledBefore!==g) SFX.trumpCut();
      else SFX.play();
    } else SFX.play();
  }
  logLine(tf('logPlay', `<b>${NAMES[p]}</b>`, cardLabel(played), !!action.jokerCall, action.jokerSuit?SUIT_GLYPH[action.jokerSuit]:''));
  if (action.jokerCall) toast(t('조커콜! 조커 보유자는 조커를 내야 합니다'));

  if (completesTrick){
    const h=game.play.history[game.play.history.length-1];
    ghost={plays:h.plays, winner:null};
  }
  // 비행 애니메이션 (세팅 자동 진행 중에는 생략)
  if (!REDUCED && !claimMode){
    const from=seatAnchor(p), to=slotAnchor(p);
    const f=cardEl(played); f.classList.add('fly');
    f.style.left='0px'; f.style.top='0px';
    f.style.transform=`translate(${from.x-32}px, ${from.y-45}px) scale(.6)`;
    $('#fx').append(f);
    requestAnimationFrame(()=>{ f.style.transform=`translate(${to.x-32}px, ${to.y-45}px) rotate(${to.rot}deg)`; });
    await sleep(300); f.remove();
  }
  render();
  if (myGen!==stateGen){ busy=false; return; }
  if (completesTrick){
    const h=game.play.history[game.play.history.length-1];
    await sleep(claimSpeed().pre);
    if (myGen!==stateGen){ busy=false; return; }
    ghost={plays:h.plays, winner:h.winner};
    renderTrick();
    logLine(tf('logTrick', h.trickNo, NAMES[h.winner], h.points));
    await sleep(claimSpeed().show);
    // 마지막 트릭은 여기서 판이 끝난다. 5장이 깔린 이 화면이 마무리 국면이라
    // 속도 설정·세팅 자동 진행과 무관하게 더 보여준다(제보: 너무 빨리 사라진다).
    const isFinalTrick = game.phase==='done' || game.play.history.length>=E.HAND_SIZE;
    if (isFinalTrick){
      await sleep(FINAL_TRICK_HOLD);
      if (myGen!==stateGen){ busy=false; return; }
    }
    // 수거 애니메이션
    if (!REDUCED && !claimMode){
      const to=seatAnchor(h.winner);
      document.querySelectorAll('#trick .slot').forEach(sl=>{
        const r=sl.getBoundingClientRect();
        const f=sl.firstChild; if(!f) return;
        f.classList.add('fly');
        f.style.position='fixed'; f.style.left='0'; f.style.top='0'; f.style.margin='0';
        f.style.transform=`translate(${r.left}px, ${r.top}px)`;
        $('#fx').append(f);
        requestAnimationFrame(()=>{ f.style.transform=`translate(${to.x-28}px, ${to.y-40}px) scale(.3)`; f.style.opacity='0'; });
        setTimeout(()=>f.remove(), claimSpeed().collect);
      });
      await sleep(claimSpeed().collect);
    }
    SFX.collect();
    ghost=null;
    // 마지막 트릭에서 엔진은 _finishGame()으로 바로 빠져 pl.table을 비우지 않는다
    // (mighty-engine.js: trickNo===HAND_SIZE면 table=[] 앞에서 return). 그래서 여기서
    // 그냥 render()하면 방금 수거한 5장이 테이블에 되살아난다(제보 2026-08-11).
    // 룰 구현인 엔진을 건드리지 않고, 마지막 트릭은 빈 테이블로 그린 뒤 곧장
    // 결과 화면으로 넘긴다.
    if (isFinalTrick){
      ghost={plays:[], winner:null};      // 테이블을 비운 상태로 고정
      render();
      busy=false;
      pump();                              // → showSettlement()
      return;
    }
    render();
    if (game.friendRevealed && game.friendDecl && game.friendDecl.mode==='first' && game.play.history.length===1){
      toast(game.friend===null?t('초구를 주공이 승리 — 사실상 노프렌드'):tf('friendToast', NAMES[game.friend]));
    }
  }
  busy=false;
  render(); pump();
}

/* ---------------- 사운드 (Web Audio 합성) ---------------- */
const SFX = (() => {
  let ctx = null;
  const on = () => settings.ui.sound !== false;
  function ac(){
    try{
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }catch(e){ return null; }
  }
  function tone({f=440, f2=null, type='sine', dur=0.18, vol=0.25, delay=0}){
    const c=ac(); if(!c||!on()) return;
    try{
      const t0=c.currentTime+delay;
      const o=c.createOscillator(), g=c.createGain();
      o.type=type; o.frequency.setValueAtTime(f,t0);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0+dur);
      g.gain.setValueAtTime(0,t0);
      g.gain.linearRampToValueAtTime(vol,t0+0.012);
      g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
      o.connect(g).connect(c.destination);
      o.start(t0); o.stop(t0+dur+0.02);
    }catch(e){}
  }
  function noiseBurst({dur=0.05, vol=0.3, delay=0, hp=1200, lp=6000}){
    const c=ac(); if(!c||!on()) return;
    try{
      const t0=c.currentTime+delay;
      const len=Math.max(1,Math.floor(c.sampleRate*dur));
      const buf=c.createBuffer(1,len,c.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
      const src=c.createBufferSource(); src.buffer=buf;
      const h=c.createBiquadFilter(); h.type='highpass'; h.frequency.value=hp;
      const l=c.createBiquadFilter(); l.type='lowpass'; l.frequency.value=lp;
      const g=c.createGain(); g.gain.value=vol;
      src.connect(h).connect(l).connect(g).connect(c.destination);
      src.start(t0);
    }catch(e){}
  }
  return {
    on,
    unlock(){ ac(); },
    shuffle(){ for(let i=0;i<9;i++) noiseBurst({dur:0.045, vol:0.22, delay:i*0.05+Math.random()*0.012, hp:900+Math.random()*1200, lp:6500}); },
    deal(){ for(let i=0;i<5;i++){ noiseBurst({dur:0.03, vol:0.2, delay:i*0.07, hp:2200, lp:8000}); tone({f:660+i*40, dur:0.04, vol:0.05, delay:i*0.07, type:'triangle'}); } },
    play(){ noiseBurst({dur:0.035, vol:0.28, hp:1800, lp:7500}); tone({f:170, dur:0.07, vol:0.12, type:'sine'}); },
    trumpCut(){ noiseBurst({dur:0.035, vol:0.25, hp:1800, lp:7500}); tone({f:294, f2:588, dur:0.16, vol:0.2, type:'sawtooth'}); tone({f:440, f2:880, dur:0.14, vol:0.1, type:'triangle', delay:0.05}); },
    firstTrump(){ tone({f:523, dur:0.12, vol:0.16, type:'triangle'}); tone({f:659, dur:0.12, vol:0.16, type:'triangle', delay:0.09}); tone({f:784, dur:0.2, vol:0.18, type:'triangle', delay:0.18}); },
    mighty(){ tone({f:98, dur:0.4, vol:0.3, type:'sawtooth'}); tone({f:196, dur:0.4, vol:0.18, type:'sawtooth'}); tone({f:392, f2:784, dur:0.3, vol:0.1, type:'triangle', delay:0.08}); },
    joker(){ tone({f:440, f2:560, dur:0.09, vol:0.2, type:'sine'}); tone({f:560, f2:392, dur:0.13, vol:0.2, type:'sine', delay:0.09}); tone({f:392, f2:660, dur:0.12, vol:0.16, type:'sine', delay:0.22}); },
    jokerCall(){ tone({f:880, dur:0.09, vol:0.22, type:'square'}); tone({f:880, dur:0.12, vol:0.22, type:'square', delay:0.15}); },
    collect(){ noiseBurst({dur:0.22, vol:0.16, hp:300, lp:2400}); tone({f:520, f2:260, dur:0.2, vol:0.08, type:'sine'}); },
    winJingle(){ [523,659,784,1047].forEach((f,i)=>tone({f, dur:0.16, vol:0.18, type:'triangle', delay:i*0.11})); },
    loseJingle(){ [392,330,262].forEach((f,i)=>tone({f, dur:0.2, vol:0.16, type:'sine', delay:i*0.13})); },
  };
})();

  const keyCards=[{n:t('마이티'), c:game.mightyCard},{n:t('조커'), c:E.JOKER}];

    keyCards.push({n:t('기루다 K'), c:{suit:g,rank:13}});
  }
  keyCards.push({n:t('조커콜'), c:game.jokerCallCard});
  s+=`<h4>${t('주요 카드')}</h4>`+keyCards.map(k=>{

  if (game.play){
    const rn=r=>({11:'J',12:'Q',13:'K',14:'A'}[r]||r);
    const seen=new Set(played.map(c=>E.cardId(c)));
    for(const c of game.hands[HUMAN]) seen.add(E.cardId(c));
    const iAmDecl = HUMAN===game.declarer;
    if (iAmDecl && game.discard) for(const c of game.discard) seen.add(E.cardId(c));
    const outTop=(su,n)=>{ const acc=[]; for(let r=14;r>=2&&acc.length<n;r--){ if(!seen.has(su+r)) acc.push(rn(r)); } return acc; };
    if (g!=='N'){
      const playedG=played.filter(c=>!E.isJoker(c)&&c.suit===g).length;
      const mineG=game.hands[HUMAN].filter(c=>!E.isJoker(c)&&c.suit===g).length;
      const discG=iAmDecl&&game.discard?game.discard.filter(c=>c.suit===g).length:0;

    }).join(' · ');
    s+=`<div class="hint" style="padding-top:2px">${tf('cheatBase', iAmDecl)}</div>`;
  }
  // 트릭별 탑 카드
  if (game.play && game.play.history.length){
    s+=`<h4>${t('트릭별 탑 카드')}</h4>`;

    }
  }
  box.innerHTML=s;
}

/* ---------------- 세팅(전승 확정) 자동 플레이 ---------------- */
let claimMode=false, claimShown=false, claimBy=null;
// 세팅 자동 진행 속도. show는 트릭 5장이 다 깔린 상태를 보여주는 시간이라
// 0에 가까우면 무슨 일이 있었는지 못 보고 지나간다(제보). 나머지는 빠르게 두고
// 이 구간만 살려 둔다.
const CLAIM_SPD={bot:0, pre:60, show:520, collect:0};
function claimSpeed(){ return claimMode ? CLAIM_SPD : SPD(); }
function sideOf(p){
  if (p===game.declarer) return t('여당');
  if (game.friendRevealed && game.friend===p) return t('여당');
  if (game.friendDecl && game.friendDecl.mode==='card' &&
      game.hands[p] && game.hands[p].some(c=>E.sameCard(c, game.friendDecl.card))) return t('여당');
  return t('야당');
}
function checkClaim(){
  if (claimShown || !game || game.phase!=='play') return false;
  if (settings.ui.autoClaim===false) return false;          // 옵션: 자동 세팅 미사용
  if (11-game.play.trickNo <= 1) return false;              // 마지막 트릭은 그냥 마무리
  const p=game.play.turn;
  if (!game.claimEligible(p)) return false;
  claimShown=true; claimBy=p;
  const left=11-game.play.trickNo;
  const pts=[]; // 남은 점수카드 수
  let remainPts=0;
  for(let q=0;q<5;q++) for(const c of game.hands[q]) if(E.isPointCard(c)) remainPts++;
  busy=true; renderSheet();
  confirmModal(t('세팅 — 전승 확정'),
    tf('claimBody', NAMES[p], sideOf(p), left, remainPts),
    t('자동 진행'), t('직접 플레이')).then(auto=>{
      claimMode=!!auto;
      busy=false;
      if (claimMode) toast(tf('claimToast', NAMES[p]), 1400);
      render(); pump();
    });
  return true;
}
function autoPickForHuman(){
  const legal=game._legalPlays(HUMAN);
  // 세팅 상황: 어떤 카드든 승리 보장 → 낮은 카드부터 소진 (조커 선출은 무늬 자동)
  const scored=legal.map(m=>{
    const c=m.card;
    let v = E.isJoker(c) ? 100 : (E.sameCard(c, game.mightyCard) ? 99 : c.rank);
    return {m, v};
  }).sort((a,b)=>a.v-b.v);
  const mv=scored[0].m;
  const act={type:'play', card:mv.card};
  if (mv.jokerSuit) act.jokerSuit=mv.jokerSuit;
  return act;
}

/** 비딩 시 '고민하는' 연출 — 좌석 강조 + 말풍선 점 애니메이션 */
function thinkTime(){
  const base={fast:[160,340], normal:[520,1150], slow:[900,1800]}[settings.ui.speed]||[520,1150];
  return base[0] + Math.random()*(base[1]-base[0]);
}
async function botThink(p){
  if (claimMode) return;
  const seat=$('#seat-'+p);

  if (bub){ bub.innerHTML='<span class="think-dots"><i></i><i></i><i></i></span>'; bub.classList.add('show'); }
